name: Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this build"
        required: false
        default: "Manual distribution build"
        type: string

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # The installed platform minor here must satisfy app/build.gradle.kts' compileSdk major
      # (currently 37); Google versions platforms as e.g. 37.0/37.1 and there is no bare
      # "android-37" package. When compileSdk's major bumps, bump the minor installed here too.
      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Upload APK to Firebase App Distribution
        run: ./gradlew assembleDebug appDistributionUploadDebug --no-daemon -PfirebaseAppDistributionReleaseNotes="${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Continuous distribution build' }}"
