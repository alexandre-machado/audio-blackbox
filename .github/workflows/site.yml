name: Site Build and Deploy
run-name: >-
  Site · ${{ github.event_name }} · ${{ github.event.pull_request.title || github.ref_name }} · #${{ github.run_number }}.${{ github.run_attempt }}

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/site.yml'
      - 'scripts/ci/check-site-rendered.sh'
      - 'scripts/ci/setup-jekyll-ruby.sh'
      - 'scripts/ci/jekyll-ruby-linux-64.lock'
      - 'scripts/ci/stage-cloudflare-site.sh'
      - 'cloudflare/**'
  workflow_dispatch:

# Minimum by default; each job widens only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# All site jobs use fresh GitHub-hosted runners (#480, AB-2411-47).
# This workflow has no pull_request trigger; each repository guard blocks fork runs.
#
# Build isolation (#415 review): `build` runs the Ruby toolchain and ~90 third-party gems with a
# read-only token and no Pages/OIDC credentials. `deploy` holds pages: write + id-token: write
# and runs only first-party actions plus the IndexNow curl.
# `validate-cloudflare` / `deploy-cloudflare` consume the same artifact on GitHub-hosted runners;
# the deploy is inert until credentials are set and only runs from main.
jobs:
  build:
    name: Site / Build and validate Jekyll
    runs-on: ubuntu-latest
    if: github.repository == 'alexandre-machado/audio-blackbox'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docs/ is Jekyll source (front matter, layouts, Liquid analytics blocks), so it must be
      # rendered before upload (#414). Uploading raw docs/ once shipped `--- ---` and
      # `{% if ... %}` as visible text on the live site.
      # No ruby/setup-ruby SHA exists in repo history. Retain the checksum-verified Ruby
      # 3.3.6 bootstrap in a fresh temporary directory until an approved action pin is available.
      # docs/Gemfile.lock still pins Jekyll 3.10.0; no persistent host toolchain is required.
      - name: Set up Ruby (micromamba, conda-forge)
        run: |
          set -euo pipefail
          bin_dir="$(bash scripts/ci/setup-jekyll-ruby.sh "${RUNNER_TEMP}/jekyll-ruby" | tail -n 1)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Build site with Jekyll
        working-directory: docs
        env:
          # production turns on the GA4/Clarity blocks in _layouts/default.html and friends.
          JEKYLL_ENV: production
          # Gems are installed fresh per run under RUNNER_TEMP (wiped by the runner), so no
          # persistent gem cache is trusted. The lockfile pins every version.
          BUNDLE_FROZEN: 'true'
          # No token at all: jekyll-github-metadata only calls the API lazily when a page reads
          # site.github, which none do (url/baseurl are set in _config.yml). NO_NETRC stops it
          # from picking up host credentials from ~/.netrc.
          NO_NETRC: '1'
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export BUNDLE_PATH="${RUNNER_TEMP}/jekyll-bundle"
          ruby -v
          bundle install --jobs 4
          bundle check
          bundle exec jekyll build --source . --destination ../_site

      # Regression guard for #414: fail before upload if the artifact still carries Liquid or
      # front matter, or if the production analytics tags are missing on the analytics pages.
      - name: Guard against unrendered Liquid
        run: bash scripts/ci/check-site-rendered.sh _site

      - name: Upload rendered site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
          include-hidden-files: true

  deploy:
    name: Site / Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'alexandre-machado/audio-blackbox'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # IndexNow reads docs/sitemap.xml and the key file from the source tree.
      - name: Checkout
        if: success() && github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Post-deploy, best-effort ping to IndexNow (Bing/Yandex share the index) so a
      # docs/** push is actively submitted instead of waiting to be crawled. Only runs
      # on a real push to main, right after a successful deploy -- a bare
      # workflow_dispatch has no guaranteed fresh deploy behind it, so it's excluded
      # to avoid submitting a possibly-stale URL set. The IndexNow key is a public,
      # non-secret random string by design (see docs/<key>.txt) -- it authorizes
      # submissions, it does not protect anything, so it is committed in the repo
      # rather than stored in GitHub Secrets. Plain curl is used so no third-party
      # action needs pinning. A non-2xx here only logs a warning: search-engine
      # notification is not a release gate and must never fail this job (#287).
      - name: Submit URLs to IndexNow
        if: success() && github.event_name == 'push'
        run: |
          set +e
          key_file="6e548543f5dfe595b4046686467f6f97.txt"
          key="$(cat "docs/${key_file}")"
          key_location="https://alexandre.machado.cc/audio-blackbox/${key_file}"
          urls="$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' docs/sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)"
          if [ -z "$urls" ]; then
            echo "::warning::IndexNow: no <loc> entries found in docs/sitemap.xml, skipping submission"
            exit 0
          fi
          payload="$(printf '{"host":"alexandre.machado.cc","key":"%s","keyLocation":"%s","urlList":[%s]}' "$key" "$key_location" "$urls")"
          http_code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")"
          echo "IndexNow response code: ${http_code}"
          cat /tmp/indexnow-response.txt 2>/dev/null || true
          case "$http_code" in
            2??) echo "IndexNow submission accepted." ;;
            *) echo "::warning::IndexNow submission returned HTTP ${http_code} (non-fatal)" ;;
          esac
          exit 0

  # Cloudflare jobs remain isolated on fresh hosted VMs (#461 @sec SEC-1).
  # The Jekyll build is now hosted too (#480); separate jobs keep its third-party
  # gems away from deployment credentials. Fresh-directory and locked-install
  # steps below remain defence in depth.
  validate-cloudflare:
    name: Site / Test and dry-run Cloudflare
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'alexandre-machado/audio-blackbox'
    permissions:
      contents: read
    steps:
      - name: Allocate fresh job directories
        id: dirs
        run: |
          set -euo pipefail
          echo "checkout=$(mktemp -d "${GITHUB_WORKSPACE}/cf-checkout.XXXXXX")" >> "$GITHUB_OUTPUT"
          echo "artifact=$(mktemp -d "${RUNNER_TEMP}/cf-artifact.XXXXXX")" >> "$GITHUB_OUTPUT"
          echo "tools=$(mktemp -d "${RUNNER_TEMP}/cf-node.XXXXXX")" >> "$GITHUB_OUTPUT"
          echo "work=$(mktemp -d "${RUNNER_TEMP}/cf-work.XXXXXX")" >> "$GITHUB_OUTPUT"

      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ steps.dirs.outputs.checkout }}

      - name: Set up fresh Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          # Do not execute a Node binary cached by the gem-running build job.
          RUNNER_TOOL_CACHE: ${{ steps.dirs.outputs.tools }}
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ steps.dirs.outputs.artifact }}

      # The Liquid guard ran in build before upload. Artifact trust is identical to
      # the Pages deploy: no cached Ruby or gem-running build scripts execute here.
      - name: Stage artifact and install locked Wrangler without lifecycle scripts
        env:
          SOURCE_DIR: ${{ steps.dirs.outputs.checkout }}
          ARTIFACT_DIR: ${{ steps.dirs.outputs.artifact }}
          WORK_DIR: ${{ steps.dirs.outputs.work }}
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/cloudflare/." "$WORK_DIR/"
          mkdir -p "$WORK_DIR/.staged/audio-blackbox"
          tar -xf "$ARTIFACT_DIR/artifact.tar" -C "$WORK_DIR/.staged/audio-blackbox"
          # #461 @sec SEC-8: the artifact comes from a separate build job. Accept only regular
          # files and directories, never a symlink (e.g. to /proc/self/environ), device or FIFO
          # that wrangler would follow and upload.
          odd="$(find "$WORK_DIR/.staged" ! -type f ! -type d -print)"
          if [ -n "$odd" ]; then
            echo "::error::Refusing to stage non-regular files from the Pages artifact:"
            echo "$odd"
            exit 1
          fi
          test -f "$WORK_DIR/.staged/audio-blackbox/404.html"
          export NPM_CONFIG_CACHE="$(mktemp -d "${RUNNER_TEMP}/cf-npm.XXXXXX")"
          export HOME="$(mktemp -d "${RUNNER_TEMP}/cf-home.XXXXXX")"
          export XDG_CONFIG_HOME="$(mktemp -d "${RUNNER_TEMP}/cf-config.XXXXXX")"
          npm ci --ignore-scripts --prefix "$WORK_DIR"

      - name: Test and dry-run without credentials
        working-directory: ${{ steps.dirs.outputs.work }}
        env:
          CLOUDFLARE_API_KEY: ''
          CLOUDFLARE_EMAIL: ''
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export HOME="$(mktemp -d "${RUNNER_TEMP}/cf-dry-home.XXXXXX")"
          export XDG_CONFIG_HOME="$(mktemp -d "${RUNNER_TEMP}/cf-dry-config.XXXXXX")"
          node --test worker.test.mjs
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/cloudflare-dry-run"

  deploy-cloudflare:
    name: Site / Deploy Cloudflare
    needs: validate-cloudflare
    runs-on: ubuntu-latest
    if: github.repository == 'alexandre-machado/audio-blackbox' && github.ref == 'refs/heads/main'
    environment: cloudflare-hotsite
    permissions:
      contents: read
    steps:
      - name: Allocate fresh job directories
        id: dirs
        run: |
          set -euo pipefail
          echo "checkout=$(mktemp -d "${GITHUB_WORKSPACE}/cf-checkout.XXXXXX")" >> "$GITHUB_OUTPUT"
          echo "artifact=$(mktemp -d "${RUNNER_TEMP}/cf-artifact.XXXXXX")" >> "$GITHUB_OUTPUT"
          echo "tools=$(mktemp -d "${RUNNER_TEMP}/cf-node.XXXXXX")" >> "$GITHUB_OUTPUT"
          echo "work=$(mktemp -d "${RUNNER_TEMP}/cf-work.XXXXXX")" >> "$GITHUB_OUTPUT"

      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ steps.dirs.outputs.checkout }}

      - name: Set up fresh Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          # Do not execute a Node binary cached by the gem-running build job.
          RUNNER_TOOL_CACHE: ${{ steps.dirs.outputs.tools }}
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ steps.dirs.outputs.artifact }}

      # The Liquid guard ran in build before upload. Artifact trust is identical to
      # the Pages deploy: no cached Ruby or gem-running build scripts execute here.
      - name: Stage artifact and install locked Wrangler without lifecycle scripts
        env:
          SOURCE_DIR: ${{ steps.dirs.outputs.checkout }}
          ARTIFACT_DIR: ${{ steps.dirs.outputs.artifact }}
          WORK_DIR: ${{ steps.dirs.outputs.work }}
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/cloudflare/." "$WORK_DIR/"
          mkdir -p "$WORK_DIR/.staged/audio-blackbox"
          tar -xf "$ARTIFACT_DIR/artifact.tar" -C "$WORK_DIR/.staged/audio-blackbox"
          # #461 @sec SEC-8: the artifact comes from a separate build job. Accept only regular
          # files and directories, never a symlink (e.g. to /proc/self/environ), device or FIFO
          # that wrangler would follow and upload.
          odd="$(find "$WORK_DIR/.staged" ! -type f ! -type d -print)"
          if [ -n "$odd" ]; then
            echo "::error::Refusing to stage non-regular files from the Pages artifact:"
            echo "$odd"
            exit 1
          fi
          test -f "$WORK_DIR/.staged/audio-blackbox/404.html"
          export NPM_CONFIG_CACHE="$(mktemp -d "${RUNNER_TEMP}/cf-npm.XXXXXX")"
          export HOME="$(mktemp -d "${RUNNER_TEMP}/cf-home.XXXXXX")"
          export XDG_CONFIG_HOME="$(mktemp -d "${RUNNER_TEMP}/cf-config.XXXXXX")"
          npm ci --ignore-scripts --prefix "$WORK_DIR"

      - name: Deploy Cloudflare Worker and assets
        working-directory: ${{ steps.dirs.outputs.work }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ''
          CLOUDFLARE_EMAIL: ''
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials missing; skipping Cloudflare deploy. GitHub Pages stays active."
            exit 0
          fi
          export HOME="$(mktemp -d "${RUNNER_TEMP}/cf-deploy-home.XXXXXX")"
          export XDG_CONFIG_HOME="$(mktemp -d "${RUNNER_TEMP}/cf-deploy-config.XXXXXX")"
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc
