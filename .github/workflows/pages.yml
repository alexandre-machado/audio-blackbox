name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/ci/check-site-rendered.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Self-hosted, like every other job in this repo (#171/#172). Safe here without the
    # head-repo fork guard the CI jobs carry, because this workflow has no `pull_request`
    # trigger at all -- it runs only on a push to main and on manual dispatch, neither of
    # which a fork can cause. The repository guard below still blocks it in a fork.
    runs-on: self-hosted
    if: github.repository == 'alexandre-machado/audio-blackbox'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # docs/ is Jekyll source (front matter, layouts, Liquid analytics blocks), so it must be
      # rendered before upload (#414). Uploading raw docs/ once shipped `--- ---` and
      # `{% if ... %}` as visible text on the live site.
      #
      # Toolchain: this job runs on the self-hosted WSL runner, which has no Docker daemon
      # (so actions/jekyll-build-pages, a Docker action, cannot run) and no sudo. ruby/setup-ruby
      # needs a writable /opt/hostedtoolcache or a Ruby pre-installed into the tool cache by
      # hand, and a relocated ruby-builder tarball cannot find its own stdlib. conda-forge's
      # Ruby is relocatable and brings its own C toolchain for native gems, so a pinned,
      # checksum-verified micromamba installs it into the runner tool cache with no host
      # changes. The env is keyed by its spec and reused once complete.
      - name: Set up Ruby (micromamba, conda-forge)
        env:
          MICROMAMBA_VERSION: 2.9.0-0
          MICROMAMBA_SHA256: 366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3
          RUBY_ENV_SPEC: ruby=3.3.6 c-compiler=2.0.0 cxx-compiler=2.0.0 make=4.4.1
          RUBY_ENV_KEY: ruby-3.3.6-cc-2.0.0-v1
        run: |
          set -euo pipefail
          tool_root="${RUNNER_TOOL_CACHE}/jekyll-ruby"
          mm_dir="${tool_root}/micromamba-${MICROMAMBA_VERSION}"
          mm="${mm_dir}/micromamba"
          if ! { [ -x "$mm" ] && echo "${MICROMAMBA_SHA256}  ${mm}" | sha256sum -c --quiet -; }; then
            mkdir -p "$mm_dir"
            curl -fsSL -o "${mm}.tmp" \
              "https://github.com/mamba-org/micromamba-releases/releases/download/${MICROMAMBA_VERSION}/micromamba-linux-64"
            echo "${MICROMAMBA_SHA256}  ${mm}.tmp" | sha256sum -c -
            chmod +x "${mm}.tmp"
            mv "${mm}.tmp" "$mm"
          fi
          env_dir="${tool_root}/${RUBY_ENV_KEY}"
          if [ ! -f "${env_dir}/.complete" ]; then
            rm -rf "$env_dir"
            # shellcheck disable=SC2086 # RUBY_ENV_SPEC is a deliberate word-split package list
            MAMBA_ROOT_PREFIX="${tool_root}/mamba-root" \
              "$mm" create -y -q -p "$env_dir" -c conda-forge --override-channels ${RUBY_ENV_SPEC}
            touch "${env_dir}/.complete"
          fi
          echo "${env_dir}/bin" >> "$GITHUB_PATH"
          echo "BUNDLE_PATH=${tool_root}/bundle-${RUBY_ENV_KEY}" >> "$GITHUB_ENV"

      - name: Build site with Jekyll
        working-directory: docs
        env:
          # production turns on the GA4/Clarity blocks in _layouts/default.html and friends.
          JEKYLL_ENV: production
          BUNDLE_FROZEN: 'true'
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ruby -v
          bundle install --jobs 4
          bundle exec jekyll build --source . --destination ../_site

      # Regression guard for #414: fail the deploy if the artifact still carries Liquid or
      # front matter, and if the production analytics block did not render on the index.
      - name: Guard against unrendered Liquid
        run: |
          set -euo pipefail
          bash scripts/ci/check-site-rendered.sh _site
          if ! grep -q 'googletagmanager.com/gtag/js' _site/index.html; then
            echo "::error file=_site/index.html::GA4 tag missing; was JEKYLL_ENV=production set?"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Post-deploy, best-effort ping to IndexNow (Bing/Yandex share the index) so a
      # docs/** push is actively submitted instead of waiting to be crawled. Only runs
      # on a real push to main, right after a successful deploy -- a bare
      # workflow_dispatch has no guaranteed fresh deploy behind it, so it's excluded
      # to avoid submitting a possibly-stale URL set. The IndexNow key is a public,
      # non-secret random string by design (see docs/<key>.txt) -- it authorizes
      # submissions, it does not protect anything, so it is committed in the repo
      # rather than stored in GitHub Secrets. Plain curl is used so no third-party
      # action needs pinning. A non-2xx here only logs a warning: search-engine
      # notification is not a release gate and must never fail this job (#287).
      - name: Submit URLs to IndexNow
        if: success() && github.event_name == 'push'
        run: |
          set +e
          key_file="6e548543f5dfe595b4046686467f6f97.txt"
          key="$(cat "docs/${key_file}")"
          key_location="https://alexandre.machado.cc/audio-blackbox/${key_file}"
          urls="$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' docs/sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)"
          if [ -z "$urls" ]; then
            echo "::warning::IndexNow: no <loc> entries found in docs/sitemap.xml, skipping submission"
            exit 0
          fi
          payload="$(printf '{"host":"alexandre.machado.cc","key":"%s","keyLocation":"%s","urlList":[%s]}' "$key" "$key_location" "$urls")"
          http_code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")"
          echo "IndexNow response code: ${http_code}"
          cat /tmp/indexnow-response.txt 2>/dev/null || true
          case "$http_code" in
            2??) echo "IndexNow submission accepted." ;;
            *) echo "::warning::IndexNow submission returned HTTP ${http_code} (non-fatal)" ;;
          esac
          exit 0
