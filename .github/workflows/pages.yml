name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/ci/check-site-rendered.sh'
      - 'scripts/ci/setup-jekyll-ruby.sh'
  workflow_dispatch:

# Minimum by default; each job widens only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Self-hosted, like every other job in this repo (#171/#172). Safe here without the head-repo
# fork guard the CI jobs carry, because this workflow has no `pull_request` trigger at all -- it
# runs only on a push to main and on manual dispatch, neither of which a fork can cause. The
# repository guard on each job still blocks it in a fork.
#
# Two jobs (#415 review): `build` runs the Ruby toolchain and ~90 third-party gems with a
# read-only token and no Pages/OIDC credentials. `deploy` holds pages: write + id-token: write
# and runs only first-party actions plus the IndexNow curl.
jobs:
  build:
    runs-on: self-hosted
    if: github.repository == 'alexandre-machado/audio-blackbox'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # docs/ is Jekyll source (front matter, layouts, Liquid analytics blocks), so it must be
      # rendered before upload (#414). Uploading raw docs/ once shipped `--- ---` and
      # `{% if ... %}` as visible text on the live site. See the script header for why the
      # toolchain is conda-forge Ruby via micromamba rather than jekyll-build-pages/setup-ruby,
      # and how the cached env is verified before reuse.
      - name: Set up Ruby (micromamba, conda-forge)
        run: |
          set -euo pipefail
          bin_dir="$(bash scripts/ci/setup-jekyll-ruby.sh "${RUNNER_TOOL_CACHE}/jekyll-ruby" | tail -n 1)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Build site with Jekyll
        working-directory: docs
        env:
          # production turns on the GA4/Clarity blocks in _layouts/default.html and friends.
          JEKYLL_ENV: production
          # Gems are installed fresh per run under RUNNER_TEMP (wiped by the runner), so no
          # persistent gem cache is trusted. The lockfile pins every version.
          BUNDLE_FROZEN: 'true'
          # No token at all: jekyll-github-metadata only calls the API lazily when a page reads
          # site.github, which none do (url/baseurl are set in _config.yml). NO_NETRC stops it
          # from picking up host credentials from ~/.netrc.
          NO_NETRC: '1'
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export BUNDLE_PATH="${RUNNER_TEMP}/jekyll-bundle"
          ruby -v
          bundle install --jobs 4
          bundle check
          bundle exec jekyll build --source . --destination ../_site

      # Regression guard for #414: fail before upload if the artifact still carries Liquid or
      # front matter, or if the production analytics tags are missing on the analytics pages.
      - name: Guard against unrendered Liquid
        run: bash scripts/ci/check-site-rendered.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.repository == 'alexandre-machado/audio-blackbox'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # IndexNow reads docs/sitemap.xml and the key file from the source tree.
      - name: Checkout
        if: success() && github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Post-deploy, best-effort ping to IndexNow (Bing/Yandex share the index) so a
      # docs/** push is actively submitted instead of waiting to be crawled. Only runs
      # on a real push to main, right after a successful deploy -- a bare
      # workflow_dispatch has no guaranteed fresh deploy behind it, so it's excluded
      # to avoid submitting a possibly-stale URL set. The IndexNow key is a public,
      # non-secret random string by design (see docs/<key>.txt) -- it authorizes
      # submissions, it does not protect anything, so it is committed in the repo
      # rather than stored in GitHub Secrets. Plain curl is used so no third-party
      # action needs pinning. A non-2xx here only logs a warning: search-engine
      # notification is not a release gate and must never fail this job (#287).
      - name: Submit URLs to IndexNow
        if: success() && github.event_name == 'push'
        run: |
          set +e
          key_file="6e548543f5dfe595b4046686467f6f97.txt"
          key="$(cat "docs/${key_file}")"
          key_location="https://alexandre.machado.cc/audio-blackbox/${key_file}"
          urls="$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' docs/sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)"
          if [ -z "$urls" ]; then
            echo "::warning::IndexNow: no <loc> entries found in docs/sitemap.xml, skipping submission"
            exit 0
          fi
          payload="$(printf '{"host":"alexandre.machado.cc","key":"%s","keyLocation":"%s","urlList":[%s]}' "$key" "$key_location" "$urls")"
          http_code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")"
          echo "IndexNow response code: ${http_code}"
          cat /tmp/indexnow-response.txt 2>/dev/null || true
          case "$http_code" in
            2??) echo "IndexNow submission accepted." ;;
            *) echo "::warning::IndexNow submission returned HTTP ${http_code} (non-fatal)" ;;
          esac
          exit 0
