name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.gitignore'
      - '.gitattributes'
      - '.agents/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.gitignore'
      - '.gitattributes'
      - '.agents/**'
      - 'LICENSE'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: self-hosted
    # Security guard: never execute external fork PRs on self-hosted runner
    if: github.repository == 'alexandre-machado/audio-blackbox' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # The installed platform minor here must satisfy app/build.gradle.kts' compileSdk major
      # (currently 37); Google versions platforms as e.g. 37.0/37.1 and there is no bare
      # "android-37" package. When compileSdk's major bumps, bump the minor installed here too.
      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Emulator-based instrumented tier (issue #34). Deliberately a separate job from `build`
  # above, which stays the primary required gate: instrumented tests are slower and structurally
  # riskier (a booted emulator, real telephony simulation) than the JVM suite. This repo's policy
  # (established on issue #26 / PR #28 round 4) is explicit that a flaky instrumented test is a
  # blocking defect, not a nuisance to route around with a retry wrapper -- so this job is
  # allowed to fail loudly and block the PR, but it must never be "fixed" by re-running it green.
  #
  # AVD parameters (API level, target, arch) come from scripts/ci/avd.env, the single source of
  # truth also used by scripts/run-instrumented-tests.sh for local runs -- see that file's
  # comments for why API 30 / google_apis / x86_64 were chosen.
  #
  # No AVD snapshot cache (PR #35 review, `@techlead` + repo owner decision). A prior version of
  # this job cached a boot snapshot with actions/cache across the two-step
  # reactivecircus/android-emulator-runner pattern (create+snapshot once, restore+boot on every
  # later run) to keep wall-clock bounded. In practice every run that restored that cached
  # snapshot failed to boot (`adb: device offline`, then a boot timeout, before any test ran);
  # the only run that ever passed was the one that built the AVD from scratch. A boot snapshot
  # restored on a different runner instance than the one that generated it is a known fragility,
  # and this job's own history confirms it rather than merely suspecting it. A CI tier that goes
  # red at random trains everyone to ignore red, which is worse than the ~4-5 extra minutes a
  # cold boot costs -- so the cache is gone; do not reintroduce it without new evidence that a
  # restored snapshot actually boots reliably on this runner pool.
  instrumented-tests:
    runs-on: self-hosted
    # Security guard: never execute external fork PRs on self-hosted runner
    if: github.repository == 'alexandre-machado/audio-blackbox' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    # Scoped to this job only -- ci.yml:9-10 keeps contents: read at workflow level for every
    # other job. Needed here, and only here, so the "commit refreshed screenshots" step below
    # (issue #231) can push to the PR head branch. The fork guard above (job-level `if:`) already
    # ensures this only ever runs against a branch in this repository, never an external fork's.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deliberately the default ref (PR #233 `@rev` finding #1, HIGH): an earlier version of
          # this job checked out `github.event.pull_request.head.ref` instead, so it could push
          # the auto-refresh commit straight back onto the PR branch it was already sitting on.
          # That silently split this run: `build` (unchanged) still validates the merge result
          # `R = merge(head, main)`, while this job validated the head commit alone. The captures
          # below would then be `I(head)`, not `I(R)` -- and any second PR that merged a
          # rendering-affecting change into `main` after this branch forked would make the
          # push-to-main failure branch further down the *routine* outcome of ordinary concurrent
          # development, not the "should be unreachable" case its own comment claims. Reverted:
          # this job now tests the same commit `build` does, and the gate step below transplants
          # the refreshed captures onto the real head branch in an isolated worktree instead of
          # trying to push the checkout it's sitting in.
          #
          # persist-credentials: false (PR #233 `@sec` medium finding): the default `true` would
          # write this job's write-scoped GITHUB_TOKEN into the workspace git config before the
          # Gradle build and the emulator test suite -- both of which run untrusted/third-party
          # code -- run, making the write token usable by anything in the job, not just the one
          # push this job intends. Auth for that push is supplied explicitly, only in the gate
          # step below, only for the git invocations that need it.
          persist-credentials: false

      # `@techlead` finding on PR #35: this job passed at 4c7a159 and failed with "No space left
      # on device" while preparing the system image at 6716346, with nothing in that diff
      # touching disk usage -- meaning the job already sat at the runner's capacity limit and
      # would fail intermittently for reasons unrelated to the code under test. Hand-rolled
      # rather than a third-party action, since this is just deleting a few preinstalled
      # directories this job never uses -- no extra supply-chain surface worth pinning a SHA for.
      #
      # Deliberately does NOT touch /usr/local/lib/android: that's the preinstalled Android SDK
      # the very next step (`Set up Android SDK`) depends on being already populated (it only
      # points env vars at it, it does not reinstall cmdline-tools/platform-tools from scratch),
      # so removing it here would break the job rather than fix it. Everything removed below is a
      # toolchain this job has no dependency on at all (.NET, Haskell/GHC, Boost, CodeQL) plus any
      # cached Docker images the runner image ships with -- see the "before"/"after" `df -h`
      # output in this step's own log for the actual headroom this buys on a given run.
      - name: Reclaim disk space (preinstalled toolchains this job never uses)
        run: |
          echo "--- disk usage before reclamation ---"
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "--- disk usage after reclamation ---"
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/ci/run-instrumented-tier.sh scripts/ci/refresh-store-captures.sh

      - name: Load AVD definition
        id: avd
        # scripts/ci/avd.env is a heavily-commented, human-readable definition (see that file's
        # own header for why each value was picked) -- $GITHUB_ENV only accepts bare KEY=VALUE
        # lines, so comments/blank lines are filtered out here rather than removed from the file
        # itself.
        run: grep -E '^[A-Z_]+=' scripts/ci/avd.env >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/ci/run-instrumented-tier.sh

      # Issue #231: the committed Play Store listing images and hotsite screenshots have drifted
      # silently from the UI twice (#228, #227) because nothing compared them against what
      # ScreenshotCaptureTest actually renders. scripts/ci/refresh-store-captures.sh is the single
      # source of truth for which capture goes where; this step runs it against this run's output
      # and treats any resulting diff as drift.
      #
      # Exact byte comparison is deliberate, not naive: three separate CI runs of identical UI
      # content (33279376700 @ 1b80936, 33279976014 @ 294eb46, 33295172792 @ 281a83e) produced
      # byte-identical captures, because the AVD is pinned (scripts/ci/avd.env: API 30, google_apis,
      # x86_64, pixel), runs on software rasterization (-gpu swiftshader_indirect, no physical GPU
      # in the path), and ScreenshotCaptureTest advances composeRule.mainClock to a fixed point
      # deterministically rather than sampling a running animation. Do not weaken this to a
      # perceptual/tolerance diff -- if a future case turns out not to be reproducible, that is a
      # STOP-and-report situation (see issue #231), not a reason to loosen the comparison quietly.
      - name: Gate committed screenshots against this run's captures (issue #231)
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ./scripts/ci/refresh-store-captures.sh

          SCREENSHOT_PATHS=(
            distribution/metadata/android/en-US/images/phoneScreenshots/1_dashboard.png
            distribution/metadata/android/en-US/images/phoneScreenshots/2_gallery.png
            distribution/metadata/android/en-US/images/phoneScreenshots/3_settings.png
            distribution/metadata/android/pt-BR/images/phoneScreenshots/1_dashboard.png
            distribution/metadata/android/pt-BR/images/phoneScreenshots/2_gallery.png
            distribution/metadata/android/pt-BR/images/phoneScreenshots/3_settings.png
            docs/assets/screenshot_dashboard.png
            docs/assets/screenshot_gallery.png
            docs/assets/screenshot_settings.png
          )

          if git diff --quiet --exit-code -- "${SCREENSHOT_PATHS[@]}"; then
            echo "Committed screenshots already match this run's captures. No drift." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CHANGED="$(git diff --name-only -- "${SCREENSHOT_PATHS[@]}")"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            {
              echo "### Screenshot drift detected and auto-corrected"
              echo ""
              echo "$CHANGED" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"

            # This checkout is on the merge ref (restored above per PR #233 `@rev` finding #1), so
            # the refreshed bytes in SCREENSHOT_PATHS right now are I(R), R = merge(head, main) --
            # the same commit `build` validates. R itself isn't a branch we can push to, so the
            # nine refreshed files are transplanted onto the real PR head branch H below.
            #
            # Issue #301: this used to be a `git commit -c commit.gpgsign=false` + `git push`, on a
            # second worktree checked out from H. The runner holds no signing key, so that commit
            # landed unsigned, and main's ruleset (required_signatures: true) then blocked the merge
            # of any PR carrying it (this happened for real on PR #300 and had to be hand-rewritten,
            # see #301). The commit is created through the GitHub GraphQL API instead
            # (`createCommitOnBranch`), which GitHub signs with its own key -- no key on the runner,
            # commit lands verified. Read directly from the nine files as they sit in this (merge-ref)
            # checkout right now and send exactly those nine as `additions`: nothing else from this
            # tree, in particular nothing from main that H doesn't already have, crosses over. That
            # invariant used to be enforced twice (the transplant loop's destinations and the `git
            # add`'s explicit path list); it's now enforced by construction -- the additions array
            # below is built only from SCREENSHOT_PATHS, so there is no working tree for a stray
            # dirty file to ride along in.
            #
            # Why this converges instead of flapping forever (PR #233 `@rev` finding #1): let H be
            # this PR's head, main be the current default branch, R = merge(H, main). This step
            # captures I(R) and commits it onto H, producing H'. Next run, merge(H', main) still
            # equals R -- the two added commits are PNG bytes only, they cannot change what any
            # Compose screen renders -- so the fresh captures are still I(R) and now match what's
            # committed on H'. Clean, nothing to push. Only when main advances with a rendering-
            # affecting change does R change; drift is then real and this step corrects it again,
            # which is the gate working as designed, not a false positive. After merge, main
            # literally is R, so its captures are I(R) -- exactly what's already committed -- which
            # is what makes the push-to-main failure branch below genuinely unreachable rather than
            # a routine outcome of ordinary concurrent development.
            AUTH_HEADER="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GH_TOKEN" | base64 | tr -d '\n')"
            git_auth() {
              git -c "http.extraheader=${AUTH_HEADER}" "$@"
            }

            # Read-only: only used to compare origin/${PR_HEAD_REF}'s current bytes against this
            # run's captures (the "nothing to commit" check) and to read its current head oid for
            # expectedHeadOid below. No commit or push happens through git anymore.
            git_auth fetch origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"

            attempt=1
            max_attempts=2
            pushed=0
            while [[ "$attempt" -le "$max_attempts" ]]; do
              nothing_to_commit=1
              for path in "${SCREENSHOT_PATHS[@]}"; do
                if ! git cat-file -e "origin/${PR_HEAD_REF}:${path}" 2>/dev/null || \
                   ! git show "origin/${PR_HEAD_REF}:${path}" | cmp -s - "$path"; then
                  nothing_to_commit=0
                  break
                fi
              done

              if [[ "$nothing_to_commit" -eq 1 ]]; then
                # origin/${PR_HEAD_REF} already has these exact bytes -- most likely a concurrent
                # run on the same branch pushed the same I(R) first. Nothing left for this run to
                # do; that's success, not a failure to retry.
                echo "${PR_HEAD_REF} already carries this run's captures (pushed by a concurrent run). Nothing to push." >> "$GITHUB_STEP_SUMMARY"
                pushed=1
                break
              fi

              HEAD_OID="$(git rev-parse "origin/${PR_HEAD_REF}")"

              ADDITIONS="$(jq -n '[]')"
              for path in "${SCREENSHOT_PATHS[@]}"; do
                ADDITIONS="$(jq -n --argjson acc "$ADDITIONS" --arg path "$path" --arg content "$(base64 -w0 "$path")" \
                  '$acc + [{path: $path, contents: $content}]')"
              done

              jq -n \
                --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid state } } } }' \
                --arg repo "$REPO" \
                --arg branch "$PR_HEAD_REF" \
                --arg headline "chore(ci): refresh screenshots from capture run ${RUN_ID}" \
                --argjson additions "$ADDITIONS" \
                --arg oid "$HEAD_OID" \
                '{query: $query, variables: {input: {
                    branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                    message: {headline: $headline},
                    fileChanges: {additions: $additions},
                    expectedHeadOid: $oid
                }}}' > /tmp/create-commit-body.json

              # `gh api graphql` exits non-zero whenever the response body carries a GraphQL-level
              # `errors` array, even on HTTP 200 (e.g. the STALE_DATA case below) -- and this `run:`
              # step executes under bash's default `-eo pipefail` (no `shell:` override in this
              # file), so a bare `RESPONSE="$(gh api graphql ...)"` would abort the whole step via
              # errexit the instant a GraphQL error came back, before the STALE_DATA retry or the
              # "failed unexpectedly" diagnostic below it ever ran. `$(...)` still captures stdout
              # into RESPONSE regardless of the inner command's exit status; `|| true` only stops
              # that non-zero status from tripping errexit on this line, so the error-handling
              # branches beneath this stay reachable.
              RESPONSE="$(gh api graphql --input /tmp/create-commit-body.json)" || true
              NEW_OID="$(echo "$RESPONSE" | jq -r '.data.createCommitOnBranch.commit.oid // empty')"

              if [[ -n "$NEW_OID" ]]; then
                # Issue #301, verified empirically on a scratch PR (#302) before this landed: a
                # commit created this way with the default GITHUB_TOKEN does NOT trigger a new
                # workflow run, same as the git push it replaces -- confirmed by watching a branch
                # with an explicit `push` trigger not fire a second time after an API-created commit
                # landed on it. So, as before: this step pushes (via the API call above) and then
                # passes, rather than waiting on or manufacturing a re-run. Do NOT "fix" a re-trigger
                # gap that isn't there by adding a dispatch or PAT-based push -- the committed bytes
                # are exactly what this run just captured and diffed against, so a re-verification
                # run would be tautological. If a future GitHub change makes this trigger a run, that
                # is a finding to report, not something to guard away.
                SIGNED="$(echo "$RESPONSE" | jq -r '.data.createCommitOnBranch.commit.signature.state // "unknown"')"
                echo "Pushed refreshed screenshots to ${PR_HEAD_REF} as ${NEW_OID} (signature: ${SIGNED})." >> "$GITHUB_STEP_SUMMARY"
                pushed=1
                break
              fi

              # expectedHeadOid mismatch surfaces as a GraphQL error of type STALE_DATA rather than
              # a git non-fast-forward rejection -- same concurrent-push scenario (branch moved
              # during this run's ~4-8 minute emulator window), same response: re-fetch and retry
              # once. Any other error type is not a race we know how to recover from; fail loudly.
              if echo "$RESPONSE" | jq -e '.errors // [] | any(.type == "STALE_DATA")' >/dev/null 2>&1; then
                echo "createCommitOnBranch on ${PR_HEAD_REF} was rejected as stale (branch moved during this run); re-fetching and retrying once." >&2
                git_auth fetch origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
                attempt=$((attempt + 1))
                continue
              fi

              echo "createCommitOnBranch failed unexpectedly:" >&2
              echo "$RESPONSE" >&2
              exit 1
            done

            if [[ "$pushed" -ne 1 ]]; then
              {
                echo "### Failed to push refreshed screenshots to ${PR_HEAD_REF}"
                echo ""
                echo "Attempted twice (once, then once more after re-fetching) and both attempts were rejected as stale: ${PR_HEAD_REF} moved again during this run. Re-run this job, or apply this run's 'screen-captures' artifact locally and push, then re-run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            {
              echo "### Screenshot drift detected on a push to main"
              echo ""
              echo "$CHANGED" | sed 's/^/- /'
              echo ""
              echo "This should be unreachable with the PR-side auto-commit gate in place: it means two PRs each changed the UI and merged such that the merge result matches neither PR's committed images (a semantic merge conflict). Failing loudly rather than letting the listing/hotsite drift further."
            } >> "$GITHUB_STEP_SUMMARY"
            git diff -- "${SCREENSHOT_PATHS[@]}" | head -c 4000
            exit 1
          fi

      # Issue #78: PNGs of both destinations, rendered on the emulator by ScreenshotCaptureTest and
      # pulled off it by the script above. The point is that a reviewer can *see* the screens from
      # a pull request instead of needing the repo owner's phone -- so this runs on failure too,
      # where the picture is worth the most. Not goldens: nothing compares them, nothing rots.
      - name: Upload screen captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screen-captures
          path: build/screen-captures/
          if-no-files-found: ignore
