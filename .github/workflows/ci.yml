name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # The installed platform minor here must satisfy app/build.gradle.kts' compileSdk major
      # (currently 37); Google versions platforms as e.g. 37.0/37.1 and there is no bare
      # "android-37" package. When compileSdk's major bumps, bump the minor installed here too.
      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Emulator-based instrumented tier (issue #34). Deliberately a separate job from `build`
  # above, which stays the primary required gate: instrumented tests are slower and structurally
  # riskier (a booted emulator, real telephony simulation) than the JVM suite, and issue #34's
  # AGENTS.md rule is explicit that a flaky instrumented test is a blocking defect, not a
  # nuisance to route around with a retry wrapper -- so this job is allowed to fail loudly and
  # block the PR, but it must never be "fixed" by re-running it green.
  #
  # AVD parameters (API level, target, arch) come from scripts/ci/avd.env, the single source of
  # truth also used by scripts/run-instrumented-tests.sh for local runs -- see that file's
  # comments for why API 30 / google_apis / x86_64 were chosen.
  #
  # Two-step AVD snapshot caching (the pattern documented by
  # reactivecircus/android-emulator-runner): the first step only creates+boots the AVD once to
  # generate a boot snapshot, cached by actions/cache; every subsequent run restores that
  # snapshot and boots from it instead of a cold boot, which is what keeps the added wall-clock
  # bounded rather than paying full boot time on every PR.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/ci/run-instrumented-tier.sh

      - name: Load AVD definition
        id: avd
        # scripts/ci/avd.env is a heavily-commented, human-readable definition (see that file's
        # own header for why each value was picked) -- $GITHUB_ENV only accepts bare KEY=VALUE
        # lines, so comments/blank lines are filtered out here rather than removed from the file
        # itself.
        run: grep -E '^[A-Z_]+=' scripts/ci/avd.env >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created; snapshot will be cached."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/ci/run-instrumented-tier.sh
