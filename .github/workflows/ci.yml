name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The installed platform minor here must satisfy app/build.gradle.kts' compileSdk major
      # (currently 37); Google versions platforms as e.g. 37.0/37.1 and there is no bare
      # "android-37" package. When compileSdk's major bumps, bump the minor installed here too.
      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Emulator-based instrumented tier (issue #34). Deliberately a separate job from `build`
  # above, which stays the primary required gate: instrumented tests are slower and structurally
  # riskier (a booted emulator, real telephony simulation) than the JVM suite. This repo's policy
  # (established on issue #26 / PR #28 round 4) is explicit that a flaky instrumented test is a
  # blocking defect, not a nuisance to route around with a retry wrapper -- so this job is
  # allowed to fail loudly and block the PR, but it must never be "fixed" by re-running it green.
  #
  # AVD parameters (API level, target, arch) come from scripts/ci/avd.env, the single source of
  # truth also used by scripts/run-instrumented-tests.sh for local runs -- see that file's
  # comments for why API 30 / google_apis / x86_64 were chosen.
  #
  # No AVD snapshot cache (PR #35 review, `@techlead` + repo owner decision). A prior version of
  # this job cached a boot snapshot with actions/cache across the two-step
  # reactivecircus/android-emulator-runner pattern (create+snapshot once, restore+boot on every
  # later run) to keep wall-clock bounded. In practice every run that restored that cached
  # snapshot failed to boot (`adb: device offline`, then a boot timeout, before any test ran);
  # the only run that ever passed was the one that built the AVD from scratch. A boot snapshot
  # restored on a different runner instance than the one that generated it is a known fragility,
  # and this job's own history confirms it rather than merely suspecting it. A CI tier that goes
  # red at random trains everyone to ignore red, which is worse than the ~4-5 extra minutes a
  # cold boot costs -- so the cache is gone; do not reintroduce it without new evidence that a
  # restored snapshot actually boots reliably on this runner pool.
  instrumented-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/ci/run-instrumented-tier.sh

      - name: Load AVD definition
        id: avd
        # scripts/ci/avd.env is a heavily-commented, human-readable definition (see that file's
        # own header for why each value was picked) -- $GITHUB_ENV only accepts bare KEY=VALUE
        # lines, so comments/blank lines are filtered out here rather than removed from the file
        # itself.
        run: grep -E '^[A-Z_]+=' scripts/ci/avd.env >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/ci/run-instrumented-tier.sh

      # Issue #78: PNGs of both destinations, rendered on the emulator by ScreenshotCaptureTest and
      # pulled off it by the script above. The point is that a reviewer can *see* the screens from
      # a pull request instead of needing the repo owner's phone -- so this runs on failure too,
      # where the picture is worth the most. Not goldens: nothing compares them, nothing rots.
      - name: Upload screen captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screen-captures
          path: build/screen-captures/
          if-no-files-found: ignore
