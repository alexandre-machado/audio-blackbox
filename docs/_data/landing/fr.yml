title: 'Audio Blackbox : enregistrez le passé sur Android'
description: Audio Blackbox est un enregistreur Android gratuit et open source qui conserve les dernières minutes de son en RAM pour sauvegarder le riff, l'idée ou la réunion que vous venez d'entendre. Rien n'est écrit avant de toucher Sauvegarder et l'app n'a pas d'autorisation internet.
social_description: Sauvegardez les dernières minutes entendues. Un tampon circulaire en RAM adapté à votre téléphone, sans autorisation internet, gratuit et open source.
image_alt: 'Visuel Audio Blackbox : un tampon continu de son ambiant pour Android, au style de tableau de bord d’aviation.'
