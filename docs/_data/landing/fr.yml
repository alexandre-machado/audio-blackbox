hero_title: Audio Blackbox pour Android
hero_lead: Gardez le riff que vous venez de jouer, l'idée exprimée à voix haute ou ce qui vient d'être convenu lors d'une réunion à laquelle vous participiez. L'app conserve les dernières minutes de son en RAM, selon la capacité du téléphone, et écrit dans le stockage <strong>uniquement lorsque vous touchez Sauvegarder</strong>.
