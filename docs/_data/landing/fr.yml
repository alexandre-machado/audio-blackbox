format_initial: PCM 16 bits · Mono
preset_voice: Voix — 16 000 Hz mono (31,3 Ko/s)
preset_balanced: Équilibré — 32 000 Hz mono (62,5 Ko/s)
preset_fidelity: Haute fidélité — 44 100 Hz stéréo (172,3 Ko/s)
preset_note: '* Voici les trois préréglages de l’app. Voix est le réglage par défaut : 16 kHz mono suffit largement à la parole, presque toujours captée par un enregistreur ambiant, et offre de loin la plus longue durée. Haute fidélité est en stéréo, ce qui active aussi plusieurs microphones sur les appareils qui en disposent.'
slider_note: '* Le curseur est illustratif. L’app n’a pas de durée maximale fixe : la limite réelle est calculée sur le téléphone selon la mémoire utilisable sans risque et le préréglage choisi, puis affichée dans les Paramètres. Le curseur s’arrête à 120 minutes pour rester pratique, pas parce que l’app s’y limite.'
