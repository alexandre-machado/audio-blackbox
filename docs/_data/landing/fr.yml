faq:
  - q: Existe-t-il une app Android qui enregistre les 5 dernières minutes d'audio ?
    a: Oui. Audio Blackbox conserve les dernières minutes de son dans la RAM du téléphone tant que sa notification s'affiche. Le tampon dure au moins 5 minutes, se règle par pas de 5 minutes et peut être plus long. L'app calcule le maximum sur votre téléphone selon la mémoire utilisable sans risque et le préréglage de qualité choisi. Touchez Sauvegarder et l'audio du tampon depuis la dernière sauvegarde (tout le tampon la première fois) devient un fichier local .m4a (AAC).
  - q: Comment sauvegarder l'audio d'avant le début de l'enregistrement ?
    a: Un enregistreur ordinaire ne le peut pas, car il ne capture qu'une fois l'enregistrement lancé. Avec Audio Blackbox, vous activez une fois l'enregistrement continu, qui conserve les dernières minutes dans un tampon circulaire en RAM, remplaçant l'audio ancien par le nouveau. Quand quelque chose à garder vient de se produire, touchez Sauvegarder pour écrire ces minutes dans un fichier. Rien n'est écrit dans le stockage avant de toucher Sauvegarder.
  - q: Qu'est-ce qu'un enregistreur rétroactif ou à tampon toujours actif ?
    a: C'est un enregistreur qui capture en continu dans un tampon mémoire de taille fixe, pour sauvegarder ce qui a déjà été dit, pas seulement ce qui suit le lancement de l'enregistrement. Audio Blackbox fonctionne ainsi sur Android, comme un service au premier plan avec notification persistante. Il conserve les dernières minutes en RAM et supprime l'audio ancien à mesure que le nouveau arrive. Sauvegarder exporte l'audio du tampon ; Direct conserve le passé du tampon et poursuit l'enregistrement jusqu'à votre arrêt (jusqu'à 2 heures par session en version gratuite, sans limite avec Pro).
  - q: Quelle est la durée du tampon et combien de RAM utilise-t-il ?
    a: Au moins 5 minutes, réglables par pas de 5 minutes. Il n'y a pas de maximum fixe. L'app calcule la limite sur votre téléphone selon la mémoire utilisable sans risque et le préréglage choisi, puis l'affiche dans les Paramètres. Avec Voix, le préréglage par défaut (16 000 Hz mono), chaque minute utilise environ 1,8 Mo de RAM, soit environ 55 Mo pour 30 minutes. Équilibré (32 000 Hz mono) en utilise deux fois plus par minute et Haute fidélité (44 100 Hz stéréo) environ 5,5 fois plus. Le même téléphone conserve donc un tampon plus court à qualité supérieure. Le calculateur de la section Architecture mémoire montre la RAM pour chaque durée et préréglage.
  - q: Audio Blackbox envoie-t-il des données ou nécessite-t-il internet ?
    a: "Non, votre audio n'est jamais envoyé. Il reste en RAM volatile jusqu'à sa sauvegarde, puis est écrit dans le dossier Recordings/Blackbox du téléphone (Music/Blackbox sur Android 10 et 11), sous votre contrôle. L'enregistrement et la sauvegarde fonctionnent sans connexion. L'app n'a ni compte, ni publicité, ni SDK d'analytique. Son seul accès réseau vient de Google Play Billing, dont la bibliothèque gère l'achat facultatif de Pro et envoie à Google sa propre télémétrie d'usage."
  - q: L'enregistrement continue-t-il quand l'écran est éteint ?
    a: Oui. Audio Blackbox fonctionne comme un service au premier plan avec notification persistante et propose un guide d'exclusion des optimisations de batterie du fabricant, pour poursuivre la capture sans interruption lorsque l'écran est verrouillé.
  - q: Un enregistreur toujours actif épuise-t-il la batterie ?
    a: Audio Blackbox a été mesuré sur un Samsung Galaxy S25 enregistrant en continu avec le préréglage Voix. Écran éteint, il utilisait environ 1,0 % à 1,5 % de batterie par heure et moins de 1 % du processeur, sans écriture disque pendant la mise en tampon. Les résultats varient selon les téléphones et les réglages.
  - q: Audio Blackbox est-il gratuit et open source ?
    a: "Il est open source sous GNU General Public License v3.0, avec tout le code sur GitHub. L'app est gratuite à installer et à utiliser. La seule option payante est un déblocage Pro en achat unique qui supprime la limite de 2 heures d'un enregistrement en direct ; tout le reste, y compris le tampon rétroactif et tous les préréglages de qualité, reste gratuit. Les personnes qui l'ont installée avant l'arrivée de Pro le reçoivent sans frais."
  - q: "Existe-t-il une alternative open source aux apps d'enregistrement rétroactif sur Android ?"
    a: "Oui. Audio Blackbox est gratuit à installer sur Google Play, avec un déblocage Pro facultatif en achat unique. L'app n'a ni compte ni publicité, et ne contient ni analytique ni traceurs. Elle est distribuée sous GNU General Public License v3.0 et tout son code est sur GitHub : chacun peut vérifier le fonctionnement du tampon et de la sauvegarde, et que l'audio ne quitte jamais l'appareil."
  - q: Quelles versions d'Android sont prises en charge ?
    a: Android 10 (niveau d'API 29) et versions ultérieures.
  - q: Comment obtenir Audio Blackbox ?
    a: "Audio Blackbox est gratuit à installer sur Google Play. Ouvrez sa fiche Play Store sur votre Android et touchez Installer ; le lien se trouve dans la section Téléchargement de cette page."
  - q: En quoi Audio Blackbox diffère-t-il de Google Recorder ou d'un enregistreur vocal ordinaire ?
    a: Un enregistreur ordinaire ne capture qu'après le lancement de l'enregistrement ; tout ce qui a été dit avant est perdu. Audio Blackbox enregistre en continu dans un tampon circulaire en RAM et n'écrit dans le stockage que lorsque vous touchez Sauvegarder. Vous pouvez ainsi garder les dernières minutes de quelque chose qui s'est déjà produit. Rien n'est écrit sur disque avant votre décision de sauvegarder et vos enregistrements ne sont jamais envoyés.
  - q: "Existe-t-il une application de dashcam audio pour Android ?"
    a: "Oui. Audio Blackbox fonctionne comme une dashcam pour le son : il conserve les dernières minutes dans un tampon circulaire en RAM et ne les écrit dans un fichier que lorsque vous touchez Sauvegarder, pour garder ce qui vient de se passer. Contrairement à un enregistreur caché, il affiche toujours une notification pendant l'enregistrement. Enregistrer d'autres personnes peut nécessiter leur consentement : vérifiez les lois locales."
  - q: "Puis-je récupérer une citation ou une explication de cours que j'ai oublié d'enregistrer ?"
    a: "Si Audio Blackbox était actif, oui. Touchez Sauvegarder et les minutes du tampon (au moins 5, jusqu'à ce que votre téléphone peut contenir) sont écrites dans un fichier .m4a, même sans avoir lancé l'enregistrement. Les journalistes peuvent l'utiliser en secours de leur enregistreur principal, et les étudiants peuvent garder une explication qu'ils viennent de manquer dans les cours où l'enregistrement est autorisé."
  - q: "Audio Blackbox peut-il m'aider à retenir des consignes orales ?"
    a: "Il peut servir d'aide-mémoire. Si vous venez d'entendre des indications, des consignes ou des détails et en avez perdu le fil, sauvegardez les dernières minutes et réécoutez-les dans le lecteur intégré. Cela peut aider toute personne qui perd souvent les informations orales, par exemple avec un TDAH. Audio Blackbox n'est pas un dispositif médical."
  - q: Que dit la loi sur l'enregistrement avec Audio Blackbox ?
    a: Cela dépend de l'endroit où vous êtes. Utilisez Audio Blackbox pour vos propres conversations et idées. Enregistrer d'autres personnes peut nécessiter leur consentement, et les règles varient selon les pays et les États. Consultez les lois locales sur l'enregistrement avant d'enregistrer. Vous êtes responsable de votre utilisation de l'app.
