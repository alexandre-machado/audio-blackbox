overview_tag: Présentation
overview_title: Qu'est-ce qu'Audio Blackbox ?
overview_intro: Audio Blackbox est une app Android gratuite et open source qui conserve en continu les dernières minutes de son en RAM et ne les écrit dans le stockage local que lorsque vous touchez Sauvegarder. Le tampon circulaire dure au moins 5 minutes, se règle par pas de 5 minutes et son maximum est calculé sur le téléphone selon la mémoire utilisable sans risque et le préréglage de qualité choisi.
overview_detail: >-
  Elle résout un problème qu'un enregistreur ordinaire ne peut pas résoudre : vous ne réalisez l'importance de quelque chose qu'<em>après</em> l'avoir entendu, quand lancer l'enregistrement ne sert plus à rien. Audio Blackbox continue d'enregistrer dans sa mémoire tant que sa notification s'affiche. Toucher Sauvegarder exporte l'audio du tampon depuis la dernière sauvegarde (tout le tampon la première fois) dans un fichier local <code>.m4a</code> (AAC), sans rembobinage ni chevauchement des fichiers. Elle s'adresse aux musiciens et auteurs-compositeurs, aux idées et réflexions à voix haute, aux réunions et accords auxquels vous participez et aux moments en famille.
overview_privacy: >-
  Contrairement à un enregistreur ordinaire ou à une app de transcription dans le cloud, Audio Blackbox n'a ni autorisation <code>INTERNET</code> dans son manifeste, ni SDK d'analytique, ni compte : rien n'est écrit sur disque avant votre décision de sauvegarder, et l'app n'envoie jamais rien.
features_tag: Fonctionnalités
features_title: Confidentialité totale et récupération immédiate
features_intro: Capture continue du son ambiant sans user votre SSD, épuiser votre batterie ni envoyer un seul octet dans le cloud.
feature_lookback: Sauvegarder le passé (Lookback)
feature_lookback_desc: Vous venez de jouer un riff à garder ou d'exprimer une idée à voix haute ? Touchez Sauvegarder et Audio Blackbox écrit l'audio du tampon depuis la dernière sauvegarde (tout le tampon la première fois) dans un fichier local. Direct conserve le passé du tampon et poursuit l'enregistrement jusqu'à votre arrêt.
feature_network: Aucune autorisation réseau
feature_network_desc: L'autorisation <code>INTERNET</code> est absente du manifeste de l'app. Elle ne peut ni envoyer de télémétrie, ni contacter des services d'analytique, ni envoyer du son. Fonctionnement entièrement hors ligne garanti.
feature_capture: Boucle de capture dédiée
feature_capture_desc: Aucune E/S disque ni allocation IPC sur le thread de capture audio. La synchronisation garantie avec un seul écrivain élimine les coupures et les pauses du ramasse-miettes.
feature_interrupt: Détection des captures concurrentes
feature_interrupt_desc: Quand une autre app au premier plan utilise le microphone, Android rend notre flux silencieux au lieu de le faire échouer. Le service le détecte directement et se met en pause, puis reprend dès que le micro est libre. L'intervalle est conservé comme un vrai silence pour éviter tout décalage des horodatages exportés.
feature_battery: Protection face aux optimisations de batterie
feature_battery_desc: Le service au premier plan, avec notification active et guide d'exclusion des optimisations de batterie du fabricant, maintient l'enregistrement sans interruption même lorsque l'écran est éteint.
feature_player: Lecteur audio intégré
feature_player_desc: Écoutez, parcourez, supprimez et partagez vos enregistrements <code>.m4a</code> (AAC) via le panneau de partage Android. Un widget sur l'écran d'accueil démarre ou arrête l'enregistrement d'un geste.
design_tag: Système de design de l'aviation américaine
design_title: Prototype vivant du design avionique
design_desc: 'Testez le simulateur interactif de cockpit dans votre navigateur : vumètre en temps réel, voyants d’état Korry, étiquette de sécurité "REMOVE BEFORE FLIGHT" et tampon mémoire sous forme de bande de vol.'
design_launch: Ouvrir le modèle de design →
memory_tag: Architecture mémoire
memory_title: Consommation de RAM prévisible
memory_desc: Audio Blackbox alloue son tampon circulaire à l'avance. Son coût en RAM est donc connu avant l'enregistrement, et un tampon actif n'est redimensionné que si la mémoire est disponible. Déplacez le curseur pour voir la RAM nécessaire à chaque durée et préréglage.
