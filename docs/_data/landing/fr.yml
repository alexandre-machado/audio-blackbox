privacy_title: Confidentialité inscrite dans l'architecture
privacy_desc: "Beaucoup d'apps d'enregistrement exigent une connexion au cloud, de l'analytique en arrière-plan et des synchronisations périodiques. Audio Blackbox n'a <strong>aucun compte</strong>, <strong>aucune publicité</strong> et <strong>aucun SDK d'analytique</strong>, et vos enregistrements ne quittent jamais l'appareil. Votre voix reste en mémoire volatile jusqu'à ce que vous la sauvegardiez dans le stockage local. Le seul accès réseau déclaré par l'app appartient à Google Play Billing, pour l'achat facultatif de Pro."
usage_tag: Utilisation
usage_title: Comment utiliser Audio Blackbox
usage_intro: 'Une fois installée, l’app est un service en arrière-plan que vous ouvrez rarement : elle écoute et vous touchez Sauvegarder quand quelque chose mérite d’être gardé.'
usage_1: Ouvrez l'app et accordez l'autorisation <code>RECORD_AUDIO</code> (et, sur Android 13+, <code>POST_NOTIFICATIONS</code>) à la demande.
usage_2: Suivez le guide d'exclusion des optimisations de batterie pour que le fabricant ne ferme pas le service d'enregistrement lorsque l'écran est éteint.
usage_3: Démarrez l'enregistrement continu. L'app fonctionne comme un service au premier plan avec une notification persistante et conserve les dernières minutes en RAM (au moins 5, jusqu'à la limite du téléphone), en remplaçant l'audio ancien par le nouveau.
usage_4: Quand quelque chose à garder vient de se produire, touchez <strong>Sauvegarder</strong>. Audio Blackbox écrit l'audio du tampon depuis la dernière sauvegarde (tout le tampon la première fois) dans le stockage local sous forme de fichier <code>.m4a</code> (AAC), sans préparation ni anticipation.
usage_5: Ouvrez le lecteur intégré pour écouter, parcourir et partager l'enregistrement exporté vers toute destination du panneau de partage Android.
