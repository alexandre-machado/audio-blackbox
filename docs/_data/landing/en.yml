faq:
- q: Is there an Android app that records the last 5 minutes of audio?
  a: "Yes. The buffer starts at 5 minutes, in 5-minute steps, up to the app's safe memory limit for the selected quality. There is no product-imposed duration cap; Settings shows the current limit."
- q: How can I save audio from before I pressed record?
  a: A normal recorder cannot do this, because it only starts capturing when you press record. With Audio Blackbox, you turn on continuous recording once and it keeps the most recent minutes in a rolling RAM buffer, replacing the oldest audio with the newest. When something worth keeping just happened, tap Save to write those minutes to a file. Audio is written to storage when you tap Save or start Live or start Live.
- q: What is a retroactive or always-on buffer recorder?
  a: "It is a recorder that keeps capturing into a fixed-size memory buffer, so you can save what was already said instead of only what comes after you press record. Live saves the buffered audio from before the tap and continues in a single .aac (ADTS) file, playable while recording. Live recording time is limited to 2 hours on the free plan, then the file is saved automatically. The file can exceed 2 hours because it includes the buffered past. A one-time Pro unlock removes the live time limit."
- q: How long is the audio buffer, and how much RAM does it use?
  a: "The buffer starts at 5 minutes, in 5-minute steps, up to the app's safe memory limit for the selected quality. There is no product-imposed duration cap; Settings shows the current limit. At the default Voice preset (16,000 Hz mono) each minute takes about 1.8 MB of RAM, so 30 minutes is about 55 MB. Balanced (32,000 Hz mono) uses twice that per minute and High fidelity (44,100 Hz stereo) about 5.5 times, so the same phone holds a shorter buffer at higher quality. The calculator in the Memory Architecture section of this page shows the RAM for any window and preset."
- q: Does Audio Blackbox upload anything, or does it need an internet connection?
  a: "Recording and saving work offline. The app itself sends no audio or usage analytics. Google Play Billing (Play services) communicates with Google to process the optional purchase and check entitlement; its library also sends its own usage and error diagnostics. No ads, account or cloud audio storage."
- q: Does it keep recording when the screen is off?
  a: Yes. Audio Blackbox runs as a foreground service with a persistent notification, and it includes a guided flow to bypass manufacturer battery optimization, so capture continues uninterrupted with the screen locked.
- q: Does an always-on recorder drain the battery?
  a: 'Audio Blackbox was measured on a Samsung Galaxy S25 recording continuously at the Voice preset: with the screen off it used about 1.0% to 1.5% of the battery per hour and under 1% CPU, with no disk writes while buffering. Other phones and settings will give different numbers.'
- q: Is Audio Blackbox free and open source?
  a: "Free to install and use, and open source under GPL-3.0. Everything except the optional one-time Pro unlock stays free. Live saves the buffered audio from before the tap and continues in a single .aac (ADTS) file, playable while recording. Live recording time is limited to 2 hours on the free plan, then the file is saved automatically. The file can exceed 2 hours because it includes the buffered past. A one-time Pro unlock removes the live time limit. Installs before 2026-12-20 at 03:00 UTC get Pro at no cost."
- q: "Is there an open-source alternative to retroactive recorder apps on Android?"
  a: "Free to install and use, and open source under GPL-3.0. Everything except the optional one-time Pro unlock stays free. The app itself sends no audio or usage analytics. Google Play Billing (Play services) communicates with Google to process the optional purchase and check entitlement; its library also sends its own usage and error diagnostics. No ads, account or cloud audio storage."
- q: What Android versions are supported?
  a: Android 10 (API level 29) and newer.
- q: How do I get Audio Blackbox?
  a: "Audio Blackbox is free to install on Google Play. Open its Play Store listing on your Android device and tap Install; the link is in the Download section of this page."
- q: How is Audio Blackbox different from Google Recorder or a normal voice recorder app?
  a: A normal recorder only captures audio after you press record, so anything said before that moment is lost. Audio Blackbox keeps recording continuously into a rolling RAM buffer and writes audio to storage when you tap Save or start Live, so you can save the last minutes of something that already happened. Audio stays in RAM until you save or start Live, and your recordings are never uploaded.
- q: "Is there an audio dashcam app for Android?"
  a: "Yes. Audio Blackbox works like a dashcam for sound: it keeps the last minutes in a rolling RAM buffer and writes them to a file when you tap Save or start Live, so you can keep what happened just before. Unlike a hidden recorder, it always shows a notification while it is recording. Recording other people may require their consent, so check your local laws."
- q: "Can I recover a quote or a lecture explanation I forgot to record?"
  a: "If Audio Blackbox was running, yes. Tap Save and the buffered minutes (at least 5, up to the app's safe memory limit for the selected quality) are written to an .m4a file, even though you never pressed record. Journalists can use it as a backup to their main recorder, and students can keep an explanation they just missed in classes where recording is allowed."
- q: "Can Audio Blackbox help me remember spoken instructions?"
  a: "It can work as a memory aid. If you just heard directions, instructions or details and lost track of them, save the last minutes and replay them in the built-in player. This can help anyone who often loses track of spoken information, for example people with ADHD. Audio Blackbox is not a medical device."
- q: Is it legal to record with Audio Blackbox?
  a: It depends on where you are. Use Audio Blackbox for your own conversations and ideas. Recording other people may require their consent, and the rules differ between countries and states. Check your local recording laws before you record; you are responsible for how you use the app.
