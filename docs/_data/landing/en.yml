overview_tag: Overview
overview_title: What is Audio Blackbox?
overview_intro: "Audio Blackbox is an open-source Android app that continuously keeps the last minutes of sound in RAM and writes them to local storage when you explicitly tap Save or start Live. The buffer starts at 5 minutes, in 5-minute steps, up to the app's safe memory limit for the selected quality. There is no product-imposed duration cap; Settings shows the current limit."
overview_detail: 'It solves a problem a normal voice recorder cannot: you only realize something mattered <em>after</em> it was already said, once the recorder button is no longer any use. Audio Blackbox keeps recording into its own memory while its notification is showing, so tapping Save exports the buffered audio since your last save (the whole buffer the first time) as a local <code>.m4a</code> (AAC) file, no rewind needed, and files never overlap. It is made for musicians and songwriters, for ideas and thinking out loud, for meetings and agreements you are part of, and for family moments.'
overview_privacy: "The app itself sends no audio or usage analytics. Google Play Billing (Play services) communicates with Google to process the optional purchase and check entitlement; its library also sends its own usage and error diagnostics. No ads, account or cloud audio storage."
features_tag: Capabilities
features_title: Designed for Total Privacy & Instant Recall
features_intro: Continuous ambient capture without wearing out your SSD, draining your battery, or uploading your audio to the cloud.
feature_lookback: Save the Past (Lookback)
feature_lookback_desc: "Just played a riff worth keeping, or said an idea out loud? Tap Save and Audio Blackbox writes the buffered audio since your last save (the whole buffer the first time) to a local file. Live saves the buffered audio from before the tap and continues in a single .aac (ADTS) file, playable while recording. Live recording time is limited to 2 hours on the free plan, then the file is saved automatically. The file can exceed 2 hours because it includes the buffered past. A one-time Pro unlock removes the live time limit."
feature_network: "Audio Never Leaves the Phone"
feature_network_desc: "The app itself sends no audio or usage analytics. Google Play Billing (Play services) communicates with Google to process the optional purchase and check entitlement; its library also sends its own usage and error diagnostics. No ads, account or cloud audio storage."
feature_capture: Dedicated Capture Loop
feature_capture_desc: Zero disk I/O and zero IPC allocations on the audio capture thread. Guaranteed single-writer synchronization eliminates dropouts and GC pauses.
feature_interrupt: Concurrent Capture Aware
feature_interrupt_desc: When another foreground app takes the microphone, Android silences our stream rather than failing it. The service detects that directly and pauses, then resumes the moment the mic is free. The gap is preserved as true silence, so exported timestamps never drift.
feature_battery: OEM Battery Survival
feature_battery_desc: Foreground service with active notification and guided manufacturer battery-optimization bypass keeps recording uninterrupted even with the screen off.
feature_player: In-App Audio Player
feature_player_desc: Listen, seek, delete, and share your saved <code>.m4a</code> / <code>.aac</code> (AAC) recordings through the Android share sheet. A home-screen widget starts or stops recording with one tap.
design_tag: US Aviation Design System
design_title: Avionics Living Design Prototype
design_desc: 'Test the interactive cockpit simulator: real-time VU meter, Korry annunciator status lights, "REMOVE BEFORE FLIGHT" safety tag, and flight tape memory buffer in your browser.'
