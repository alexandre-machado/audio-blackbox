memory_tag: Memory Architecture
memory_title: Predictable RAM Footprint
memory_desc: Audio Blackbox allocates its circular buffer up front, so its RAM cost is known before recording starts, and it only resizes a running buffer when the memory is there. Slide to see the RAM a window takes at each preset.
