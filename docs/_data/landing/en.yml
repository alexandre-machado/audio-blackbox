overview_tag: Overview
overview_title: What is Audio Blackbox?
overview_intro: Audio Blackbox is an open-source Android app that continuously keeps the last minutes of sound in RAM and writes them to local storage only when you explicitly tap Save. The rolling buffer is at least 5 minutes, set in 5-minute steps, and its maximum is computed on your phone from the memory it can safely use and the quality preset you pick.
overview_detail: 'It solves a problem a normal voice recorder cannot: you only realize something mattered <em>after</em> it was already said, once the recorder button is no longer any use. Audio Blackbox keeps recording into its own memory while its notification is showing, so tapping Save exports the buffered audio since your last save (the whole buffer the first time) as a local <code>.m4a</code> (AAC) file, no rewind needed, and files never overlap. It is made for musicians and songwriters, for ideas and thinking out loud, for meetings and agreements you are part of, and for family moments.'
overview_privacy: "Unlike a normal recorder or a cloud-backed transcription app, Audio Blackbox has no account, no cloud, no ads and no analytics SDK: nothing is written to disk until you decide to save it, and your recordings never leave your phone."
features_tag: Capabilities
features_title: Designed for Total Privacy & Instant Recall
features_intro: Continuous ambient capture without wearing out your SSD, draining your battery, or uploading your audio to the cloud.
feature_lookback: Save the Past (Lookback)
feature_lookback_desc: Just played a riff worth keeping, or said an idea out loud? Tap Save and Audio Blackbox writes the buffered audio since your last save (the whole buffer the first time) to a local file. Live keeps the buffered past and carries on recording until you stop (up to 2 hours per session in the free version, unlimited with Pro).
feature_network: "Audio Never Leaves the Phone"
feature_network_desc: "There is no upload path for your audio anywhere in the app: no account, no cloud, no ads, no analytics SDK. The only network use is Google Play Billing's own library, for the optional Pro purchase."
feature_capture: Dedicated Capture Loop
feature_capture_desc: Zero disk I/O and zero IPC allocations on the audio capture thread. Guaranteed single-writer synchronization eliminates dropouts and GC pauses.
feature_interrupt: Concurrent Capture Aware
feature_interrupt_desc: When another foreground app takes the microphone, Android silences our stream rather than failing it. The service detects that directly and pauses, then resumes the moment the mic is free. The gap is preserved as true silence, so exported timestamps never drift.
feature_battery: OEM Battery Survival
feature_battery_desc: Foreground service with active notification and guided manufacturer battery-optimization bypass keeps recording uninterrupted even with the screen off.
feature_player: In-App Audio Player
feature_player_desc: Listen, seek, delete, and share your saved <code>.m4a</code> (AAC) recordings through the Android share sheet. A home-screen widget starts or stops recording with one tap.
