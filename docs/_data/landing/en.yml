privacy_title: Architecturally Private by Design
privacy_desc: Many recording apps require cloud logins, background analytics, and periodic syncing. Audio Blackbox contains <strong>no internet permission</strong> in its Android manifest, has <strong>no analytics SDKs</strong>, and never touches remote servers. Your voice stays in volatile memory until you save it to local storage.
usage_tag: Usage
usage_title: How to Use Audio Blackbox
usage_intro: 'Once installed, the app is a background service you rarely open: it listens, and you tap Save when something is worth keeping.'
usage_1: Open the app and grant the <code>RECORD_AUDIO</code> permission (and, on Android 13+, <code>POST_NOTIFICATIONS</code>) when prompted.
usage_2: Follow the guided battery-optimization bypass so the recording service is not killed by the OEM when the screen is off.
usage_3: Start continuous recording. The app runs as a foreground service with a persistent notification and keeps the most recent minutes in RAM (at least 5, up to the ceiling your phone can hold), discarding older audio as new audio arrives.
usage_4: When something worth keeping just happened, tap <strong>Save</strong>. Audio Blackbox writes the buffered audio since your last save (the whole buffer the first time) to local storage as a <code>.m4a</code> (AAC) file, and nothing needs to be pre-armed or predicted.
usage_5: Open the in-app player to listen, seek, and share the exported recording through any Android Sharesheet target.
