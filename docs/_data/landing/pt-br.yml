faq:
  - q: Existe um app Android que grava os últimos 5 minutos de áudio?
    a: "Sim. O buffer começa em 5 minutos, ajustáveis de 5 em 5, até o limite seguro de memória do app para a qualidade escolhida. Não há teto de duração imposto pelo produto; os Ajustes mostram o limite atual."
  - q: Como salvar áudio de antes de eu apertar gravar?
    a: Um gravador comum não faz isso, porque só começa a capturar quando você aperta gravar. Com o Audio Blackbox, você liga a gravação contínua uma vez e ele mantém os minutos mais recentes em um buffer circular na RAM, substituindo o áudio mais antigo pelo mais novo. Quando algo que vale guardar acabou de acontecer, toque em Salvar para gravar esses minutos em um arquivo. O áudio fica na RAM até você tocar em Salvar ou iniciar Ao vivo.
  - q: O que é um gravador retroativo ou de buffer sempre ativo?
    a: "É um gravador que captura continuamente em um buffer de memória de tamanho fixo, para salvar o que já foi dito, além do que vem depois de apertar gravar. Ao vivo salva o áudio do buffer anterior ao toque e continua em um único arquivo: .aac (ADTS) com AAC (padrão), reproduzível durante a gravação, ou .ogg com Opus, que exige aguardar o término para ouvir. O tempo de gravação ao vivo é limitado a 2 horas no plano gratuito; depois, o arquivo é salvo automaticamente. O arquivo pode ultrapassar 2 horas porque inclui o passado do buffer. O desbloqueio Pro de pagamento único remove o limite de tempo ao vivo."
  - q: Qual é a duração do buffer e quanta RAM ele usa?
    a: "O buffer começa em 5 minutos, ajustáveis de 5 em 5, até o limite seguro de memória do app para a qualidade escolhida. Não há teto de duração imposto pelo produto; os Ajustes mostram o limite atual. No preset padrão Voz (16.000 Hz mono), cada minuto usa cerca de 1,8 MB de RAM, então 30 minutos usam cerca de 55 MB. Equilibrado (32.000 Hz mono) usa o dobro por minuto e Alta fidelidade (44.100 Hz estéreo) cerca de 5,5 vezes mais. Assim, o mesmo celular comporta um buffer menor com qualidade maior. A calculadora na seção Arquitetura de memória mostra a RAM para qualquer janela e preset."
  - q: O Audio Blackbox envia algo ou precisa de internet?
    a: "Gravar e salvar funcionam sem conexão. O próprio app não envia áudio nem analytics de uso. O Google Play Billing (serviços do Google Play) se comunica com o Google para processar a compra opcional e verificar o direito ao Pro; a biblioteca também envia seus próprios diagnósticos de uso e erros. Sem anúncios, conta ou armazenamento de áudio na nuvem."
  - q: Ele continua gravando com a tela apagada?
    a: Sim. O Audio Blackbox roda como serviço em primeiro plano com notificação persistente e inclui orientação para dispensar a otimização de bateria do fabricante, mantendo a captura sem interrupções com a tela bloqueada.
  - q: Um gravador sempre ativo esgota a bateria?
    a: O Audio Blackbox foi medido em um Samsung Galaxy S25 gravando continuamente no preset Voz. Com a tela apagada, usou cerca de 1,0% a 1,5% da bateria por hora e menos de 1% de CPU, sem escritas em disco durante o preenchimento do buffer. Outros celulares e ajustes terão resultados diferentes.
  - q: O Audio Blackbox é gratuito e de código aberto?
    a: "Gratuito para instalar e usar, com código aberto sob GPL-3.0. Tudo continua gratuito, exceto o desbloqueio Pro opcional de pagamento único. Ao vivo salva o áudio do buffer anterior ao toque e continua em um único arquivo: .aac (ADTS) com AAC (padrão), reproduzível durante a gravação, ou .ogg com Opus, que exige aguardar o término para ouvir. O tempo de gravação ao vivo é limitado a 2 horas no plano gratuito; depois, o arquivo é salvo automaticamente. O arquivo pode ultrapassar 2 horas porque inclui o passado do buffer. O desbloqueio Pro de pagamento único remove o limite de tempo ao vivo. Pro grátis para quem chega cedo: instale o Audio Blackbox até 19 de dezembro de 2026 (antes de 20/12, 00h no horário de Brasília) e o Pro fica liberado neste aparelho, sem custo, para sempre. O benefício vale para essa instalação: se desinstalar e instalar de novo, ou trocar de aparelho, ele não é mantido."
  - q: "Existe uma alternativa de código aberto a gravadores retroativos no Android?"
    a: "Gratuito para instalar e usar, com código aberto sob GPL-3.0. Tudo continua gratuito, exceto o desbloqueio Pro opcional de pagamento único. O próprio app não envia áudio nem analytics de uso. O Google Play Billing (serviços do Google Play) se comunica com o Google para processar a compra opcional e verificar o direito ao Pro; a biblioteca também envia seus próprios diagnósticos de uso e erros. Sem anúncios, conta ou armazenamento de áudio na nuvem."
  - q: Quais versões do Android são compatíveis?
    a: Android 10 (API 29) ou mais recente.
  - q: Como baixar o Audio Blackbox?
    a: "O Audio Blackbox é gratuito para instalar no Google Play. Abra a página na Play Store pelo seu Android e toque em Instalar; o link está na seção Download desta página."
  - q: Qual é a diferença entre o Audio Blackbox e o Google Recorder ou um gravador de voz comum?
    a: Um gravador comum só captura depois de apertar gravar, então tudo que foi dito antes se perde. O Audio Blackbox grava continuamente em um buffer circular na RAM e escreve áudio no armazenamento quando você toca em Salvar ou inicia Ao vivo. Assim, você pode guardar os últimos minutos de algo que já aconteceu. O áudio fica na RAM até você salvar ou iniciar Ao vivo, e as suas gravações nunca são enviadas.
  - q: "Existe um app de dashcam de áudio para Android?"
    a: "Sim. O Audio Blackbox funciona como uma dashcam para o som: guarda os últimos minutos em um buffer circular na RAM e grava áudio em arquivo quando você toca em Salvar ou inicia Ao vivo, para você guardar o que aconteceu logo antes. Diferente de um gravador escondido, ele sempre mostra uma notificação enquanto grava. Gravar outras pessoas pode exigir o consentimento delas, então consulte as leis do seu local."
  - q: "Consigo recuperar uma citação ou explicação de aula que esqueci de gravar?"
    a: "Se o Audio Blackbox estava ligado, sim. Toque em Salvar e os minutos do buffer (pelo menos 5, até o limite seguro de memória do app para a qualidade escolhida) são gravados em um arquivo .m4a (AAC) ou .ogg (Opus), mesmo sem você ter apertado gravar. Jornalistas podem usá-lo como backup do gravador principal, e estudantes podem guardar uma explicação que acabaram de perder nas aulas em que gravar é permitido."
  - q: "O Audio Blackbox pode me ajudar a lembrar instruções faladas?"
    a: "Ele pode servir de apoio à memória. Se você acabou de ouvir orientações, instruções ou detalhes e perdeu o fio, salve os últimos minutos e ouça de novo no player integrado. Isso pode ajudar quem costuma perder informações faladas, como pessoas com TDAH. O Audio Blackbox não é um dispositivo médico."
  - q: É permitido gravar com o Audio Blackbox?
    a: Depende de onde você está. Use o Audio Blackbox para as suas próprias conversas e ideias. Gravar outras pessoas pode exigir o consentimento delas, e as regras variam entre países e estados. Consulte as leis de gravação do seu local antes de gravar. O uso do app é de sua responsabilidade.
