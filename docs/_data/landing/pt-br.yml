format_initial: PCM de 16 bits · Mono
preset_voice: Voz — 16.000 Hz mono (31,3 KB/s)
preset_balanced: Equilibrado — 32.000 Hz mono (62,5 KB/s)
preset_fidelity: Alta fidelidade — 44.100 Hz estéreo (172,3 KB/s)
preset_note: '* Estes são os três presets do app. Voz é o padrão: 16 kHz mono é suficiente para fala, o que um gravador de ambiente quase sempre captura, e oferece uma janela muito mais longa. Alta fidelidade é estéreo, o que também permite usar mais de um microfone nos aparelhos com vários.'
slider_note: '* O controle é ilustrativo. O app não tem uma janela máxima fixa: o limite real é calculado no celular com base na memória que pode usar com segurança e no preset escolhido, e aparece nos Ajustes. O controle para em 120 minutos por facilidade de uso, não porque o app pare aí.'
