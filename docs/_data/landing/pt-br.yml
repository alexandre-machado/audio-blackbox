overview_tag: Visão geral
overview_title: O que é o Audio Blackbox?
overview_intro: "O Audio Blackbox é um app Android de código aberto que mantém continuamente os últimos minutos de som na RAM e os grava no armazenamento local quando você toca em Salvar ou inicia Ao vivo. O buffer começa em 5 minutos, ajustáveis de 5 em 5, até o limite seguro de memória do app para a qualidade escolhida. Não há teto de duração imposto pelo produto; os Ajustes mostram o limite atual."
overview_detail: >-
  Ele resolve um problema que um gravador comum não resolve: você só percebe que algo importava <em>depois</em> de ter sido dito, quando apertar gravar já não adianta. O Audio Blackbox continua gravando na própria memória enquanto a notificação aparece. Tocar em Salvar exporta o áudio do buffer desde o último salvamento (o buffer inteiro na primeira vez) para um arquivo local <code>.m4a</code> (AAC) ou <code>.ogg</code> (Opus), sem precisar voltar no tempo e sem sobreposição entre os arquivos. Foi feito para músicos e compositores, ideias e pensamentos em voz alta, reuniões e combinados dos quais você participa e momentos em família.
overview_privacy: "O próprio app não envia áudio nem analytics de uso. O Google Play Billing (serviços do Google Play) se comunica com o Google para processar a compra opcional e verificar o direito ao Pro; a biblioteca também envia seus próprios diagnósticos de uso e erros. Sem anúncios, conta ou armazenamento de áudio na nuvem."
features_tag: Recursos
features_title: Feito para privacidade total e recuperação imediata
features_intro: Captura contínua do ambiente sem desgastar o SSD, esgotar a bateria ou enviar o seu áudio para a nuvem.
feature_lookback: Salvar o passado (Lookback)
feature_lookback_desc: "Acabou de tocar um riff que vale guardar ou falar uma ideia em voz alta? Toque em Salvar e o Audio Blackbox grava o áudio do buffer desde o último salvamento (o buffer inteiro na primeira vez) em um arquivo local. Ao vivo salva o áudio do buffer anterior ao toque e continua em um único arquivo: .aac (ADTS) com AAC (padrão), reproduzível durante a gravação, ou .ogg com Opus, que exige aguardar o término para ouvir. O tempo de gravação ao vivo é limitado a 2 horas no plano gratuito; depois, o arquivo é salvo automaticamente. O arquivo pode ultrapassar 2 horas porque inclui o passado do buffer. O desbloqueio Pro de pagamento único remove o limite de tempo ao vivo. Formato ao salvar é gratuito, sem precisar do Pro: AAC (padrão) salva arquivos .m4a ao tocar em Salvar, ou escolha Opus (.ogg) para Salvar e Ao vivo. AAC (.m4a): maior compatibilidade. Opus (.ogg): voz em arquivos menores. Alguns players e apps de mensagem podem não abrir. Com AAC selecionado: Ao vivo continua em AAC (.aac), reproduzível durante a gravação. Para ouvir a gravação em Opus, aguarde o término. Se o app fechar inesperadamente, o trecho já salvo pode ser recuperado, mas o final pode se perder e alguns players podem não abrir o arquivo. Ao reabrir após um fechamento inesperado, o áudio Opus já gravado é recuperado; a última página Ogg incompleta é descartada, então o final pode se perder. Opus pode estar indisponível em alguns aparelhos; a opção fica desativada com o motivo indicado."
feature_network: "O áudio nunca sai do celular"
feature_network_desc: "O próprio app não envia áudio nem analytics de uso. O Google Play Billing (serviços do Google Play) se comunica com o Google para processar a compra opcional e verificar o direito ao Pro; a biblioteca também envia seus próprios diagnósticos de uso e erros. Sem anúncios, conta ou armazenamento de áudio na nuvem."
feature_capture: Loop dedicado de captura
feature_capture_desc: Zero E/S de disco e zero alocações de IPC na thread de captura de áudio. A sincronização garantida com um único escritor elimina falhas e pausas de coleta de lixo.
feature_interrupt: Detecta outras capturas
feature_interrupt_desc: Quando outro app em primeiro plano assume o microfone, o Android silencia nosso fluxo em vez de encerrá-lo com erro. O serviço detecta isso diretamente e pausa, retomando assim que o microfone fica livre. A lacuna é mantida como silêncio real, para que os tempos exportados não se desloquem.
feature_battery: Proteção contra otimização de bateria
feature_battery_desc: O serviço em primeiro plano, com notificação ativa e orientação para dispensar a otimização de bateria do fabricante, mantém a gravação sem interrupções mesmo com a tela apagada.
feature_player: Player de áudio integrado
feature_player_desc: Ouça, avance, apague e compartilhe as gravações <code>.m4a</code> / <code>.aac</code> (AAC) ou <code>.ogg</code> (Opus) pela folha de compartilhamento do Android. Um widget na tela inicial liga ou desliga a gravação com um toque.
