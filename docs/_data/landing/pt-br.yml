hero_title: O Audio Blackbox para Android
hero_lead: Guarde o riff que acabou de tocar, a ideia que acabou de falar em voz alta ou o que foi combinado numa reunião da qual você participou. O app mantém os últimos minutos de som na RAM, na medida do seu celular, e grava no armazenamento <strong>só quando você toca em Salvar</strong>.
