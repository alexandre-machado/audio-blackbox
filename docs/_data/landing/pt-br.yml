memory_tag: Arquitetura de memória
memory_title: Uso previsível de RAM
memory_desc: O Audio Blackbox aloca seu buffer circular antecipadamente, então o custo de RAM é conhecido antes da gravação. Só redimensiona um buffer em uso quando há memória. Arraste para ver quanta RAM cada janela usa em cada preset.
