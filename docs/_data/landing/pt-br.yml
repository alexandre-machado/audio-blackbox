faq:
  - q: Existe um app Android que grava os últimos 5 minutos de áudio?
    a: Sim. O Audio Blackbox mantém os últimos minutos de som na RAM do celular enquanto a notificação aparece. O buffer tem no mínimo 5 minutos, ajustáveis de 5 em 5, e pode ser maior. O app calcula o máximo no celular a partir da memória que pode usar com segurança e do preset de qualidade escolhido. Toque em Salvar e o áudio do buffer desde o último salvamento (o buffer inteiro na primeira vez) vira um arquivo local .m4a (AAC).
  - q: Como salvar áudio de antes de eu apertar gravar?
    a: Um gravador comum não faz isso, porque só começa a capturar quando você aperta gravar. Com o Audio Blackbox, você liga a gravação contínua uma vez e ele mantém os minutos mais recentes em um buffer circular na RAM, substituindo o áudio mais antigo pelo mais novo. Quando algo que vale guardar acabou de acontecer, toque em Salvar para gravar esses minutos em um arquivo. Nada vai para o armazenamento até você tocar em Salvar.
  - q: O que é um gravador retroativo ou de buffer sempre ativo?
    a: É um gravador que captura continuamente em um buffer de memória de tamanho fixo, para salvar o que já foi dito, além do que vem depois de apertar gravar. O Audio Blackbox funciona assim no Android, como serviço em primeiro plano com notificação persistente. Ele mantém os últimos minutos na RAM e descarta o áudio mais antigo conforme chega o novo. Salvar exporta o áudio do buffer; Ao vivo mantém o passado do buffer e continua gravando até você parar (até 2 horas por sessão na versão gratuita, sem limite com o Pro).
  - q: Qual é a duração do buffer e quanta RAM ele usa?
    a: Pelo menos 5 minutos, ajustáveis de 5 em 5. Não há máximo fixo. O app calcula o limite no celular a partir da memória que pode usar com segurança e do preset escolhido, e o mostra nos Ajustes. No preset padrão Voz (16.000 Hz mono), cada minuto usa cerca de 1,8 MB de RAM, então 30 minutos usam cerca de 55 MB. Equilibrado (32.000 Hz mono) usa o dobro por minuto e Alta fidelidade (44.100 Hz estéreo) cerca de 5,5 vezes mais. Assim, o mesmo celular comporta um buffer menor com qualidade maior. A calculadora na seção Arquitetura de memória mostra a RAM para qualquer janela e preset.
  - q: O Audio Blackbox envia algo ou precisa de internet?
    a: "Não, o seu áudio nunca é enviado. Ele fica na RAM volátil até você salvar e depois vai para a pasta Recordings/Blackbox do seu celular (Music/Blackbox no Android 10 e 11), sob o seu controle. Gravar e salvar funcionam sem conexão. O app não tem conta, anúncios nem SDK de analytics. O único acesso à rede vem do Google Play Billing, cuja biblioteca cuida da compra opcional do Pro e envia ao Google a própria telemetria de uso."
  - q: Ele continua gravando com a tela apagada?
    a: Sim. O Audio Blackbox roda como serviço em primeiro plano com notificação persistente e inclui orientação para dispensar a otimização de bateria do fabricante, mantendo a captura sem interrupções com a tela bloqueada.
  - q: Um gravador sempre ativo esgota a bateria?
    a: O Audio Blackbox foi medido em um Samsung Galaxy S25 gravando continuamente no preset Voz. Com a tela apagada, usou cerca de 1,0% a 1,5% da bateria por hora e menos de 1% de CPU, sem escritas em disco durante o preenchimento do buffer. Outros celulares e ajustes terão resultados diferentes.
  - q: O Audio Blackbox é gratuito e de código aberto?
    a: "É de código aberto, sob a GNU General Public License v3.0, com todo o código no GitHub. O app é gratuito para instalar e usar. A única opção paga é um desbloqueio Pro de pagamento único que remove o limite de 2 horas de uma gravação ao vivo; todo o resto, incluindo o buffer retroativo e todos os presets de qualidade, continua gratuito. Quem instalou antes do Pro existir recebe o Pro sem custo."
  - q: "Existe uma alternativa de código aberto a gravadores retroativos no Android?"
    a: "Sim. O Audio Blackbox é gratuito para instalar no Google Play, com desbloqueio Pro opcional de pagamento único. O app não tem conta nem anúncios, analytics ou rastreadores. Ele é licenciado sob a GNU General Public License v3.0 e todo o código está no GitHub, então qualquer pessoa pode conferir como o buffer e o salvamento funcionam, e que o áudio nunca sai do aparelho."
  - q: Quais versões do Android são compatíveis?
    a: Android 10 (API 29) ou mais recente.
  - q: Como baixar o Audio Blackbox?
    a: "O Audio Blackbox é gratuito para instalar no Google Play. Abra a página na Play Store pelo seu Android e toque em Instalar; o link está na seção Download desta página."
  - q: Qual é a diferença entre o Audio Blackbox e o Google Recorder ou um gravador de voz comum?
    a: Um gravador comum só captura depois de apertar gravar, então tudo que foi dito antes se perde. O Audio Blackbox grava continuamente em um buffer circular na RAM e só escreve no armazenamento quando você toca em Salvar. Assim, você pode guardar os últimos minutos de algo que já aconteceu. Nada é gravado em disco até você decidir salvar, e as suas gravações nunca são enviadas.
  - q: "Existe um app de dashcam de áudio para Android?"
    a: "Sim. O Audio Blackbox funciona como uma dashcam para o som: guarda os últimos minutos em um buffer circular na RAM e só grava em arquivo quando você toca em Salvar, para você guardar o que aconteceu logo antes. Diferente de um gravador escondido, ele sempre mostra uma notificação enquanto grava. Gravar outras pessoas pode exigir o consentimento delas, então consulte as leis do seu local."
  - q: "Consigo recuperar uma citação ou explicação de aula que esqueci de gravar?"
    a: "Se o Audio Blackbox estava ligado, sim. Toque em Salvar e os minutos do buffer (pelo menos 5, até o que o seu celular comporta) são gravados em um arquivo .m4a, mesmo sem você ter apertado gravar. Jornalistas podem usá-lo como backup do gravador principal, e estudantes podem guardar uma explicação que acabaram de perder nas aulas em que gravar é permitido."
  - q: "O Audio Blackbox pode me ajudar a lembrar instruções faladas?"
    a: "Ele pode servir de apoio à memória. Se você acabou de ouvir orientações, instruções ou detalhes e perdeu o fio, salve os últimos minutos e ouça de novo no player integrado. Isso pode ajudar quem costuma perder informações faladas, como pessoas com TDAH. O Audio Blackbox não é um dispositivo médico."
  - q: É permitido gravar com o Audio Blackbox?
    a: Depende de onde você está. Use o Audio Blackbox para as suas próprias conversas e ideias. Gravar outras pessoas pode exigir o consentimento delas, e as regras variam entre países e estados. Consulte as leis de gravação do seu local antes de gravar. O uso do app é de sua responsabilidade.
