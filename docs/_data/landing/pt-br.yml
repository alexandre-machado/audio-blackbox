privacy_title: Privacidade na própria arquitetura
privacy_desc: "Muitos apps de gravação exigem login na nuvem, analytics em segundo plano e sincronização periódica. O Audio Blackbox <strong>não tem conta</strong>, <strong>não tem anúncios</strong> e <strong>não tem SDKs de analytics</strong>, e as suas gravações nunca saem do aparelho. Sua voz fica na memória volátil até você salvar no armazenamento local. O único acesso à rede declarado pelo app pertence ao Google Play Billing, para a compra opcional do Pro."
usage_tag: Uso
usage_title: Como usar o Audio Blackbox
usage_intro: 'Depois de instalado, o app é um serviço em segundo plano que você raramente abre: ele escuta, e você toca em Salvar quando algo vale guardar.'
usage_1: Abra o app e conceda a permissão <code>RECORD_AUDIO</code> (e, no Android 13+, <code>POST_NOTIFICATIONS</code>) quando solicitado.
usage_2: Siga a orientação para dispensar a otimização de bateria, para que o fabricante não encerre o serviço de gravação com a tela apagada.
usage_3: Inicie a gravação contínua. O app roda como serviço em primeiro plano com uma notificação persistente e mantém os últimos minutos na RAM (pelo menos 5, até o limite do celular), descartando o áudio antigo conforme chega o novo.
usage_4: Quando algo que vale guardar acabou de acontecer, toque em <strong>Salvar</strong>. O Audio Blackbox grava o áudio do buffer desde o último salvamento (o buffer inteiro na primeira vez) no armazenamento local como arquivo <code>.m4a</code> (AAC), sem precisar preparar ou prever nada.
usage_5: Abra o player do app para ouvir, avançar e compartilhar a gravação exportada por qualquer destino da folha de compartilhamento do Android.
