hero_title: O Audio Blackbox para Android
hero_lead: "Uma dashcam de áudio no seu bolso. Salve o riff que acabou de tocar, a citação que quase perdeu ou as instruções que acabou de receber. Ele guarda os últimos minutos de som na RAM, na medida do seu celular, e só grava no armazenamento <strong>quando você toca em Salvar</strong>."
