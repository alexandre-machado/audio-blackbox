hero_title: O Audio Blackbox para Android
hero_lead: "Uma dashcam de áudio no seu bolso. Salve o riff que acabou de tocar, a citação que quase perdeu ou as instruções que acabou de receber. Ele guarda os últimos minutos de som na RAM, dentro do limite seguro de memória do app, e só grava no armazenamento <strong>quando você toca em Salvar ou inicia Ao vivo</strong>."
