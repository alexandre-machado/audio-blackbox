overview_tag: Visão geral
overview_title: O que é o Audio Blackbox?
overview_intro: O Audio Blackbox é um app Android de código aberto que mantém continuamente os últimos minutos de som na RAM e só os grava no armazenamento local quando você toca em Salvar. O buffer circular tem no mínimo 5 minutos, ajustáveis de 5 em 5, e seu máximo é calculado no celular a partir da memória que pode usar com segurança e do preset de qualidade escolhido.
overview_detail: >-
  Ele resolve um problema que um gravador comum não resolve: você só percebe que algo importava <em>depois</em> de ter sido dito, quando apertar gravar já não adianta. O Audio Blackbox continua gravando na própria memória enquanto a notificação aparece. Tocar em Salvar exporta o áudio do buffer desde o último salvamento (o buffer inteiro na primeira vez) para um arquivo local <code>.m4a</code> (AAC), sem precisar voltar no tempo e sem sobreposição entre os arquivos. Foi feito para músicos e compositores, ideias e pensamentos em voz alta, reuniões e combinados dos quais você participa e momentos em família.
overview_privacy: "Diferente de um gravador comum ou app de transcrição na nuvem, o Audio Blackbox não tem conta, nuvem, anúncios nem SDK de analytics: nada é gravado em disco até você decidir salvar, e as suas gravações nunca saem do celular."
features_tag: Recursos
features_title: Feito para privacidade total e recuperação imediata
features_intro: Captura contínua do ambiente sem desgastar o SSD, esgotar a bateria ou enviar o seu áudio para a nuvem.
feature_lookback: Salvar o passado (Lookback)
feature_lookback_desc: Acabou de tocar um riff que vale guardar ou falar uma ideia em voz alta? Toque em Salvar e o Audio Blackbox grava o áudio do buffer desde o último salvamento (o buffer inteiro na primeira vez) em um arquivo local. Ao vivo mantém o passado do buffer e continua gravando até você parar (até 2 horas por sessão na versão gratuita, sem limite com o Pro).
feature_network: "O áudio nunca sai do celular"
feature_network_desc: "Não existe nenhum caminho de envio do seu áudio no app: sem conta, sem nuvem, sem anúncios, sem SDK de analytics. O único uso de rede é a própria biblioteca do Google Play Billing, para a compra opcional do Pro."
feature_capture: Loop dedicado de captura
feature_capture_desc: Zero E/S de disco e zero alocações de IPC na thread de captura de áudio. A sincronização garantida com um único escritor elimina falhas e pausas de coleta de lixo.
feature_interrupt: Detecta outras capturas
feature_interrupt_desc: Quando outro app em primeiro plano assume o microfone, o Android silencia nosso fluxo em vez de encerrá-lo com erro. O serviço detecta isso diretamente e pausa, retomando assim que o microfone fica livre. A lacuna é mantida como silêncio real, para que os tempos exportados não se desloquem.
feature_battery: Proteção contra otimização de bateria
feature_battery_desc: O serviço em primeiro plano, com notificação ativa e orientação para dispensar a otimização de bateria do fabricante, mantém a gravação sem interrupções mesmo com a tela apagada.
feature_player: Player de áudio integrado
feature_player_desc: Ouça, avance, apague e compartilhe as gravações <code>.m4a</code> (AAC) pela folha de compartilhamento do Android. Um widget na tela inicial liga ou desliga a gravação com um toque.
design_tag: Sistema de design da aviação dos EUA
design_title: Protótipo vivo de design aviônico
design_desc: 'Teste o simulador interativo de cockpit no navegador: medidor VU em tempo real, luzes de estado Korry, etiqueta de segurança "REMOVE BEFORE FLIGHT" e buffer de memória em fita de voo.'
