title: 'Audio Blackbox: gravador do passado para Android'
description: O Audio Blackbox é um gravador Android gratuito e de código aberto que guarda os últimos minutos de som na RAM para você salvar o riff, a ideia ou a reunião que acabou de ouvir. Nada é gravado até tocar em Salvar, e o app não tem permissão de internet.
social_description: Salve os últimos minutos que acabou de ouvir. Buffer circular na RAM na medida do seu celular, sem permissão de internet, gratuito e de código aberto.
image_alt: 'Arte do Audio Blackbox: um buffer contínuo de áudio ambiente para Android com visual de painel de instrumentos de aviação.'
