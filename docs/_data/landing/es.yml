overview_tag: Resumen
overview_title: ¿Qué es Audio Blackbox?
overview_intro: Audio Blackbox es una app Android gratuita y de código abierto que conserva continuamente los últimos minutos de sonido en RAM y solo los escribe en el almacenamiento local cuando tocas Guardar. El búfer circular tiene al menos 5 minutos, ajustables en pasos de 5, y su máximo se calcula en el móvil según la memoria que puede usar de forma segura y el perfil de calidad elegido.
overview_detail: >-
  Resuelve un problema que un grabador normal no puede resolver: solo te das cuenta de que algo importaba <em>después</em> de que se haya dicho, cuando pulsar grabar ya no sirve. Audio Blackbox sigue grabando en su memoria mientras se muestra su notificación. Al tocar Guardar, exporta el audio del búfer desde el último guardado (todo el búfer la primera vez) a un archivo local <code>.m4a</code> (AAC), sin necesidad de rebobinar y sin solapar archivos. Está pensada para músicos y compositores, ideas y pensamientos en voz alta, reuniones y acuerdos en los que participas y momentos en familia.
overview_privacy: >-
  A diferencia de un grabador normal o una app de transcripción en la nube, Audio Blackbox no tiene permiso <code>INTERNET</code> en su manifiesto, SDK de analítica ni cuenta: no escribe nada en disco hasta que decides guardarlo y nunca sube nada.
features_tag: Funciones
features_title: Diseñada para la privacidad total y la recuperación inmediata
features_intro: Captura continua del ambiente sin desgastar el SSD, agotar la batería ni subir un solo byte a la nube.
feature_lookback: Guardar el pasado (Lookback)
feature_lookback_desc: ¿Acabas de tocar un riff que merece la pena guardar o de decir una idea en voz alta? Toca Guardar y Audio Blackbox escribe el audio del búfer desde el último guardado (todo el búfer la primera vez) en un archivo local. Directo conserva el pasado del búfer y sigue grabando hasta que lo detienes.
feature_network: Sin permiso de red
feature_network_desc: El permiso <code>INTERNET</code> está ausente del manifiesto de la aplicación. No puede enviar telemetría, contactar servicios de analítica ni subir sonido. Funcionamiento completamente sin conexión garantizado.
feature_capture: Bucle de captura dedicado
feature_capture_desc: Sin E/S de disco ni asignaciones de IPC en el hilo de captura de audio. La sincronización garantizada con un único escritor elimina cortes y pausas de recolección de basura.
feature_interrupt: Detecta otras capturas
feature_interrupt_desc: Cuando otra app en primer plano ocupa el micrófono, Android silencia nuestro flujo en vez de hacer que falle. El servicio lo detecta directamente y se pausa; se reanuda en cuanto el micrófono queda libre. El intervalo se conserva como silencio real para que las marcas de tiempo exportadas no se desplacen.
feature_battery: Protección ante la optimización de batería
feature_battery_desc: Un servicio en primer plano con notificación activa y una guía para excluirlo de la optimización de batería del fabricante mantienen la grabación sin interrupciones incluso con la pantalla apagada.
feature_player: Reproductor de audio integrado
feature_player_desc: Escucha, recorre, elimina y comparte tus grabaciones <code>.m4a</code> (AAC) mediante el panel de compartir de Android. Un widget en la pantalla de inicio permite iniciar o detener la grabación con un toque.
design_tag: Sistema de diseño de la aviación de EE. UU.
design_title: Prototipo vivo de diseño de aviónica
design_desc: 'Prueba el simulador interactivo de cabina en el navegador: medidor VU en tiempo real, indicadores de estado Korry, etiqueta de seguridad "REMOVE BEFORE FLIGHT" y búfer de memoria con formato de cinta de vuelo.'
