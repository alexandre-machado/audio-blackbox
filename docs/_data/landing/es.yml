privacy_title: Privacidad desde la arquitectura
privacy_desc: Muchas apps de grabación requieren iniciar sesión en la nube, analítica en segundo plano y sincronización periódica. Audio Blackbox <strong>no tiene permiso de internet</strong> en su manifiesto Android, <strong>no tiene SDK de analítica</strong> y nunca contacta con servidores remotos. Tu voz permanece en memoria volátil hasta que la guardas en el almacenamiento local.
usage_tag: Uso
usage_title: Cómo usar Audio Blackbox
usage_intro: 'Una vez instalada, la app es un servicio en segundo plano que rara vez abres: escucha y tú tocas Guardar cuando algo merece conservarse.'
usage_1: Abre la app y concede el permiso <code>RECORD_AUDIO</code> (y, en Android 13+, <code>POST_NOTIFICATIONS</code>) cuando se solicite.
usage_2: Sigue la guía para excluir la app de la optimización de batería, para que el fabricante no cierre el servicio con la pantalla apagada.
usage_3: Inicia la grabación continua. La app funciona como servicio en primer plano con una notificación persistente y mantiene los minutos más recientes en RAM (al menos 5, hasta el límite de tu móvil), descartando el audio antiguo conforme llega el nuevo.
usage_4: Cuando algo que vale la pena guardar acaba de ocurrir, toca <strong>Guardar</strong>. Audio Blackbox escribe el audio del búfer desde el último guardado (todo el búfer la primera vez) en el almacenamiento local como archivo <code>.m4a</code> (AAC), sin tener que preparar ni prever nada.
usage_5: Abre el reproductor integrado para escuchar, recorrer y compartir la grabación exportada mediante cualquier destino del panel de compartir de Android.
