preset_note: '* Estos son los tres perfiles de la app. Voz es el predeterminado: 16 kHz mono basta para el habla, que es lo que un grabador ambiental casi siempre captura, y permite un intervalo mucho más largo. Alta fidelidad es estéreo, lo que también activa más de un micrófono en los dispositivos que tienen varios.'
slider_note: '* El control es ilustrativo. La app no tiene un intervalo máximo fijo: el límite real se calcula en el móvil según la memoria que puede usar de forma segura y el perfil elegido, y se muestra en Ajustes. El control termina en 120 minutos por facilidad de uso, no porque lo haga la app.'
