title: 'Audio Blackbox: graba el pasado en Android'
description: Audio Blackbox es un grabador Android gratuito y de código abierto que conserva los últimos minutos de sonido en RAM para guardar el riff, la idea o la reunión que acabas de oír. No escribe nada hasta tocar Guardar y no tiene permiso de internet.
social_description: Guarda los últimos minutos que acabas de oír. Búfer circular en RAM adaptado a tu móvil, sin permiso de internet, gratuito y de código abierto.
