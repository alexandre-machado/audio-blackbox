faq:
  - q: ¿Hay una app Android que grabe los últimos 5 minutos de audio?
    a: Sí. Audio Blackbox conserva los últimos minutos de sonido en la RAM del móvil mientras se muestra su notificación. El búfer tiene al menos 5 minutos, ajustables en pasos de 5, y puede ser mayor. La app calcula el máximo en tu móvil según la memoria que puede usar de forma segura y el perfil de calidad elegido. Toca Guardar y el audio del búfer desde el último guardado (todo el búfer la primera vez) se convierte en un archivo local .m4a (AAC).
  - q: ¿Cómo puedo guardar audio anterior a pulsar grabar?
    a: Un grabador normal no puede hacerlo, porque solo empieza a capturar al pulsar grabar. Con Audio Blackbox, activas la grabación continua una vez y conserva los minutos más recientes en un búfer circular en RAM, sustituyendo el audio más antiguo por el más nuevo. Cuando algo que merece conservarse acaba de ocurrir, toca Guardar para escribir esos minutos en un archivo. No se escribe nada en el almacenamiento hasta que tocas Guardar.
  - q: ¿Qué es un grabador retroactivo o con búfer siempre activo?
    a: Es un grabador que captura continuamente en un búfer de memoria de tamaño fijo, para guardar lo que ya se ha dicho en vez de solo lo que viene después de pulsar grabar. Audio Blackbox funciona así en Android, como servicio en primer plano con notificación persistente. Conserva los últimos minutos en RAM y descarta el audio antiguo conforme llega el nuevo. Guardar exporta el audio del búfer; Directo conserva el pasado del búfer y sigue grabando hasta que lo detienes.
  - q: ¿Cuánto dura el búfer y cuánta RAM utiliza?
    a: Al menos 5 minutos, ajustables en pasos de 5. No hay un máximo fijo. La app calcula el límite en tu móvil según la memoria que puede usar de forma segura y el perfil elegido, y lo muestra en Ajustes. Con Voz, el perfil predeterminado (16.000 Hz mono), cada minuto usa unos 1,8 MB de RAM, por lo que 30 minutos son unos 55 MB. Equilibrado (32.000 Hz mono) usa el doble por minuto y Alta fidelidad (44.100 Hz estéreo) unas 5,5 veces más. El mismo móvil conserva un búfer más corto con mayor calidad. La calculadora de la sección Arquitectura de memoria muestra la RAM para cualquier intervalo y perfil.
  - q: ¿Audio Blackbox sube algo o necesita conexión a internet?
    a: No. El permiso INTERNET está ausente del manifiesto Android de la app, por lo que no puede enviar telemetría, contactar servicios de analítica ni subir sonido. La app nunca sube nada. El audio permanece en RAM volátil hasta que lo guardas y se escribe en la carpeta Recordings/Blackbox del móvil (Music/Blackbox en Android 10 y 11), bajo tu control.
  - q: ¿Sigue grabando con la pantalla apagada?
    a: Sí. Audio Blackbox funciona como servicio en primer plano con notificación persistente e incluye una guía para excluirlo de la optimización de batería del fabricante, de modo que la captura continúa sin interrupciones con la pantalla bloqueada.
  - q: ¿Un grabador siempre activo agota la batería?
    a: Se midió Audio Blackbox en un Samsung Galaxy S25 grabando continuamente con el perfil Voz. Con la pantalla apagada usó aproximadamente entre el 1,0% y el 1,5% de batería por hora y menos del 1% de CPU, sin escrituras en disco durante el almacenamiento en el búfer. Otros móviles y ajustes darán resultados distintos.
  - q: ¿Audio Blackbox es gratuita y de código abierto?
    a: Sí. Es gratuita y tiene licencia GNU General Public License v3.0, con todo el código fuente publicado en GitHub.
  - q: ¿Hay una alternativa gratuita y de código abierto a las apps de grabación retroactiva en Android?
    a: Sí. Audio Blackbox es gratuita en Google Play. La app no tiene cuenta ni anuncios, analítica o rastreadores. Tiene licencia GNU General Public License v3.0 y todo su código está en GitHub. Cualquiera puede comprobar cómo funcionan el búfer y el guardado y confirmar que el manifiesto no tiene permiso INTERNET.
  - q: ¿Qué versiones de Android son compatibles?
    a: Android 10 (nivel de API 29) y posteriores.
  - q: ¿Cómo consigo Audio Blackbox?
    a: Audio Blackbox es gratuita en Google Play. Abre su ficha en Play Store desde tu Android y toca Instalar. El enlace está en la sección Descargar de esta página.
  - q: ¿En qué se diferencia Audio Blackbox de Google Recorder o de un grabador de voz normal?
    a: Un grabador normal solo captura después de pulsar grabar, por lo que todo lo dicho antes se pierde. Audio Blackbox graba continuamente en un búfer circular en RAM y solo escribe en el almacenamiento al tocar Guardar. Así puedes guardar los últimos minutos de algo que ya ocurrió. No se escribe nada en disco hasta que decides guardarlo y la app nunca sube nada.
  - q: ¿Se puede grabar con Audio Blackbox según la ley?
    a: Depende de dónde estés. Usa Audio Blackbox para tus propias conversaciones e ideas. Grabar a otras personas puede requerir su consentimiento, y las normas varían entre países y estados. Consulta la legislación local sobre grabaciones antes de grabar. Eres responsable del uso que hagas de la app.
