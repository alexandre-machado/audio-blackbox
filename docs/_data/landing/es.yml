memory_tag: Arquitectura de memoria
memory_title: Uso predecible de RAM
memory_desc: Audio Blackbox asigna su búfer circular por adelantado, de modo que el coste de RAM se conoce antes de empezar a grabar. Solo redimensiona un búfer activo cuando hay memoria disponible. Desliza para ver la RAM que necesita cada intervalo con cada perfil.
