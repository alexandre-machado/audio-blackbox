hero_title: Audio Blackbox für Android
hero_lead: Behalte das gerade gespielte Riff, die laut ausgesprochene Idee oder das, was in einem Meeting vereinbart wurde, an dem du teilgenommen hast. Die App hält die letzten Minuten Ton im RAM, passend zur Kapazität deines Handys, und schreibt <strong>erst beim Tippen auf Speichern</strong> in den Gerätespeicher.
