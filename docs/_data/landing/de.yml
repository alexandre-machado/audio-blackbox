overview_tag: Überblick
overview_title: Was ist Audio Blackbox?
overview_intro: "Audio Blackbox ist eine quelloffene Android-App, die kontinuierlich die letzten Minuten Ton im RAM hält und beim Tippen auf Speichern oder beim Start von Live in den lokalen Gerätespeicher schreibt. Der Puffer beginnt bei 5 Minuten, in 5-Minuten-Schritten, bis zur sicheren Speichergrenze der App für die gewählte Qualität. Es gibt keine produktseitige Dauerbegrenzung; die Einstellungen zeigen die aktuelle Grenze."
overview_detail: >-
  Die App löst ein Problem, das ein normaler Sprachrekorder nicht lösen kann: Du erkennst erst <em>nach</em> dem Gesagten, dass es wichtig war, wenn die Aufnahmetaste nichts mehr nützt. Audio Blackbox nimmt in den eigenen Arbeitsspeicher auf, solange die Benachrichtigung angezeigt wird. Speichern exportiert das Audio im Puffer seit dem letzten Speichern (beim ersten Mal den ganzen Puffer) als lokale <code>.m4a</code>-Datei (AAC), ohne Zurückspulen und ohne Überschneidungen zwischen den Dateien. Die App ist für Musiker und Songwriter, Ideen und lautes Nachdenken, Meetings und Vereinbarungen, an denen du beteiligt bist, sowie Familienmomente gedacht.
overview_privacy: "Die App selbst sendet weder Audio noch Nutzungsanalysen. Google Play Billing (Google Play-Dienste) kommuniziert mit Google, um den optionalen Kauf abzuwickeln und die Pro-Berechtigung zu prüfen; die Bibliothek sendet auch eigene Nutzungs- und Fehlerdiagnosen. Keine Werbung, kein Konto und kein Cloud-Audiospeicher."
features_tag: Funktionen
features_title: Für vollständige Privatsphäre und sofortigen Rückblick
features_intro: Kontinuierliche Aufnahme der Umgebung, ohne deine SSD zu verschleißen, deinen Akku zu leeren oder dein Audio in die Cloud hochzuladen.
feature_lookback: Vergangenheit speichern (Lookback)
feature_lookback_desc: "Gerade ein Riff gespielt, das du behalten möchtest, oder eine Idee laut ausgesprochen? Tippe auf Speichern und Audio Blackbox schreibt das Audio im Puffer seit dem letzten Speichern (beim ersten Mal den ganzen Puffer) in eine lokale Datei. Live speichert das gepufferte Audio von vor dem Tippen und nimmt in einer einzigen .aac-Datei (ADTS) weiter auf, die schon während der Aufnahme abspielbar ist. Die Live-Aufnahmezeit ist kostenlos auf 2 Stunden begrenzt; danach wird die Datei automatisch gespeichert. Mit der gepufferten Vergangenheit kann die Datei länger als 2 Stunden sein. Pro hebt per Einmalkauf die Live-Zeitgrenze auf."
feature_network: "Audio verlässt nie das Handy"
feature_network_desc: "Die App selbst sendet weder Audio noch Nutzungsanalysen. Google Play Billing (Google Play-Dienste) kommuniziert mit Google, um den optionalen Kauf abzuwickeln und die Pro-Berechtigung zu prüfen; die Bibliothek sendet auch eigene Nutzungs- und Fehlerdiagnosen. Keine Werbung, kein Konto und kein Cloud-Audiospeicher."
feature_capture: Eigene Aufnahmeschleife
feature_capture_desc: Keine Datenträger-E/A und keine IPC-Allokationen im Audio-Aufnahmethread. Garantierte Synchronisierung mit genau einem Schreiber verhindert Aussetzer und Pausen durch die Speicherbereinigung.
feature_interrupt: Erkennt gleichzeitige Aufnahmen
feature_interrupt_desc: Belegt eine andere App im Vordergrund das Mikrofon, schaltet Android unseren Audiostream stumm, statt ihn mit einem Fehler zu beenden. Der Dienst erkennt dies direkt und pausiert. Sobald das Mikrofon frei ist, setzt er die Aufnahme fort. Die Lücke bleibt als echte Stille erhalten, damit exportierte Zeitstempel nicht abweichen.
feature_battery: Schutz vor Akkuoptimierung des Herstellers
feature_battery_desc: Ein Vordergrunddienst mit aktiver Benachrichtigung und einer Anleitung zum Ausnehmen der App von der Akkuoptimierung des Herstellers hält die Aufnahme auch bei ausgeschaltetem Bildschirm ohne Unterbrechung am Laufen.
feature_player: Integrierter Audioplayer
feature_player_desc: Höre deine gespeicherten <code>.m4a</code>- und <code>.aac</code>-Aufnahmen (AAC) an, spule, lösche und teile sie über das Android-Teilen-Menü. Ein Startbildschirm-Widget startet oder stoppt die Aufnahme mit einem Tippen.
