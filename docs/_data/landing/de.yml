overview_tag: Überblick
overview_title: Was ist Audio Blackbox?
overview_intro: Audio Blackbox ist eine kostenlose, quelloffene Android-App, die kontinuierlich die letzten Minuten Ton im RAM hält und erst beim ausdrücklichen Tippen auf Speichern in den lokalen Gerätespeicher schreibt. Der Ringpuffer umfasst mindestens 5 Minuten und lässt sich in 5-Minuten-Schritten einstellen. Sein Maximum wird auf deinem Handy anhand des sicher nutzbaren Speichers und des gewählten Qualitätsprofils berechnet.
overview_detail: >-
  Die App löst ein Problem, das ein normaler Sprachrekorder nicht lösen kann: Du erkennst erst <em>nach</em> dem Gesagten, dass es wichtig war, wenn die Aufnahmetaste nichts mehr nützt. Audio Blackbox nimmt in den eigenen Arbeitsspeicher auf, solange die Benachrichtigung angezeigt wird. Speichern exportiert das Audio im Puffer seit dem letzten Speichern (beim ersten Mal den ganzen Puffer) als lokale <code>.m4a</code>-Datei (AAC), ohne Zurückspulen und ohne Überschneidungen zwischen den Dateien. Die App ist für Musiker und Songwriter, Ideen und lautes Nachdenken, Meetings und Vereinbarungen, an denen du beteiligt bist, sowie Familienmomente gedacht.
overview_privacy: >-
  Anders als ein normaler Rekorder oder eine Transkriptions-App mit Cloud hat Audio Blackbox keine <code>INTERNET</code>-Berechtigung im Manifest, kein Analyse-SDK und kein Konto: Erst wenn du dich zum Speichern entscheidest, wird etwas auf den Datenträger geschrieben. Die App lädt nie etwas hoch.
features_tag: Funktionen
features_title: Für vollständige Privatsphäre und sofortigen Rückblick
features_intro: Kontinuierliche Aufnahme der Umgebung, ohne deine SSD zu verschleißen, deinen Akku zu leeren oder ein einziges Byte in die Cloud hochzuladen.
feature_lookback: Vergangenheit speichern (Lookback)
feature_lookback_desc: Gerade ein Riff gespielt, das du behalten möchtest, oder eine Idee laut ausgesprochen? Tippe auf Speichern und Audio Blackbox schreibt das Audio im Puffer seit dem letzten Speichern (beim ersten Mal den ganzen Puffer) in eine lokale Datei. Live behält die Vergangenheit im Puffer und nimmt weiter auf, bis du stoppst.
feature_network: Keine Netzwerkberechtigung
feature_network_desc: Die <code>INTERNET</code>-Berechtigung fehlt vollständig im App-Manifest. Die App kann keine Telemetrie senden, Analysedienste kontaktieren oder Ton hochladen. Vollständig offline garantiert.
feature_capture: Eigene Aufnahmeschleife
feature_capture_desc: Keine Datenträger-E/A und keine IPC-Allokationen im Audio-Aufnahmethread. Garantierte Synchronisierung mit genau einem Schreiber verhindert Aussetzer und Pausen durch die Speicherbereinigung.
feature_interrupt: Erkennt gleichzeitige Aufnahmen
feature_interrupt_desc: Belegt eine andere App im Vordergrund das Mikrofon, schaltet Android unseren Audiostream stumm, statt ihn mit einem Fehler zu beenden. Der Dienst erkennt dies direkt und pausiert. Sobald das Mikrofon frei ist, setzt er die Aufnahme fort. Die Lücke bleibt als echte Stille erhalten, damit exportierte Zeitstempel nicht abweichen.
feature_battery: Schutz vor Akkuoptimierung des Herstellers
feature_battery_desc: Ein Vordergrunddienst mit aktiver Benachrichtigung und einer Anleitung zum Ausnehmen der App von der Akkuoptimierung des Herstellers hält die Aufnahme auch bei ausgeschaltetem Bildschirm ohne Unterbrechung am Laufen.
feature_player: Integrierter Audioplayer
feature_player_desc: Höre deine gespeicherten <code>.m4a</code>-Aufnahmen (AAC) an, spule, lösche und teile sie über das Android-Teilen-Menü. Ein Startbildschirm-Widget startet oder stoppt die Aufnahme mit einem Tippen.
design_tag: Designsystem der US-Luftfahrt
design_title: Interaktiver Avionik-Designprototyp
design_desc: 'Teste den interaktiven Cockpit-Simulator im Browser: VU-Meter in Echtzeit, Korry-Statusleuchten, Sicherheitsanhänger "REMOVE BEFORE FLIGHT" und Speicherpuffer als Flugbandanzeige.'
design_launch: Designmodell öffnen →
memory_tag: Speicherarchitektur
memory_title: Vorhersehbarer RAM-Bedarf
memory_desc: Audio Blackbox reserviert den Ringpuffer im Voraus. Der RAM-Bedarf ist daher vor Aufnahmestart bekannt. Ein laufender Puffer wird nur bei verfügbarem Speicher vergrößert oder verkleinert. Bewege den Regler, um den RAM-Bedarf je Dauer und Profil zu sehen.
