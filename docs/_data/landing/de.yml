preset_note: '* Dies sind die drei Profile der App. Sprache ist der Standard: 16 kHz mono reicht für Sprache, die ein Umgebungsrekorder fast immer aufnimmt, und ermöglicht mit Abstand die längste Dauer. Hohe Klangtreue ist stereo und nutzt dadurch auch mehrere Mikrofone auf entsprechend ausgestatteten Geräten.'
slider_note: '* Der Regler dient der Veranschaulichung. Die App hat keine feste Höchstdauer: Die tatsächliche Grenze wird auf deinem Handy aus dem sicher nutzbaren Speicher und dem gewählten Profil berechnet und in den Einstellungen angezeigt. Der Regler endet bei 120 Minuten, damit er gut bedienbar bleibt, nicht weil die App dort aufhört.'
