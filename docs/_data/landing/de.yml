faq:
  - q: Gibt es eine Android-App, die die letzten 5 Minuten Audio aufnimmt?
    a: Ja. Audio Blackbox hält die letzten Minuten Ton im RAM deines Handys, solange die Benachrichtigung angezeigt wird. Der Puffer umfasst mindestens 5 Minuten, einstellbar in 5-Minuten-Schritten, und kann länger sein. Die App berechnet das Maximum auf deinem Handy anhand des sicher nutzbaren Speichers und des gewählten Qualitätsprofils. Tippe auf Speichern, und das Audio im Puffer seit dem letzten Speichern (beim ersten Mal der ganze Puffer) wird zu einer lokalen .m4a-Datei (AAC).
  - q: Wie kann ich Audio von vor dem Drücken der Aufnahmetaste speichern?
    a: Ein normaler Rekorder kann das nicht, weil er erst beim Drücken der Aufnahmetaste beginnt. Bei Audio Blackbox schaltest du die kontinuierliche Aufnahme einmal ein. Die letzten Minuten bleiben in einem Ringpuffer im RAM, wobei das neueste Audio das älteste ersetzt. Ist gerade etwas passiert, das du behalten möchtest, tippe auf Speichern, um diese Minuten in eine Datei zu schreiben. Bis du auf Speichern tippst, wird nichts in den Gerätespeicher geschrieben.
  - q: Was ist ein rückwirkender Rekorder oder ein Rekorder mit ständig aktivem Puffer?
    a: Er nimmt fortlaufend in einen Speicherpuffer fester Größe auf. So kannst du bereits Gesagtes speichern, statt nur das, was nach dem Drücken der Aufnahmetaste kommt. Audio Blackbox arbeitet so auf Android, als Vordergrunddienst mit dauerhafter Benachrichtigung. Die letzten Minuten bleiben im RAM; älteres Audio wird verworfen, sobald neues hinzukommt. Speichern exportiert das Audio im Puffer. Live behält die Vergangenheit im Puffer und nimmt weiter auf, bis du stoppst (in der kostenlosen Version bis zu 2 Stunden pro Sitzung, mit Pro unbegrenzt).
  - q: Wie lang ist der Audiopuffer und wie viel RAM benötigt er?
    a: Mindestens 5 Minuten, einstellbar in 5-Minuten-Schritten. Es gibt kein festes Maximum. Die App berechnet die Grenze auf deinem Handy anhand des sicher nutzbaren Speichers und des gewählten Profils und zeigt sie in den Einstellungen an. Beim Standardprofil Sprache (16.000 Hz mono) benötigt jede Minute etwa 1,8 MB RAM, also etwa 55 MB für 30 Minuten. Ausgewogen (32.000 Hz mono) benötigt pro Minute doppelt so viel, Hohe Klangtreue (44.100 Hz stereo) etwa das 5,5-Fache. Dasselbe Handy hält bei höherer Qualität daher einen kürzeren Puffer. Der Rechner im Abschnitt Speicherarchitektur zeigt den RAM-Bedarf für jede Dauer und jedes Profil.
  - q: Lädt Audio Blackbox etwas hoch oder braucht es eine Internetverbindung?
    a: "Nein, dein Audio wird nie hochgeladen. Es bleibt im flüchtigen RAM, bis du es speicherst, und landet dann im Ordner Recordings/Blackbox auf deinem Handy (Music/Blackbox unter Android 10 und 11), unter deiner Kontrolle. Aufnehmen und Speichern funktionieren ohne Verbindung. Die App hat kein Konto, keine Werbung und kein Analyse-SDK. Ihr einziger Netzwerkzugriff stammt von Google Play Billing, dessen Bibliothek den optionalen Pro-Kauf abwickelt und ihre eigene Nutzungstelemetrie an Google sendet."
  - q: Läuft die Aufnahme bei ausgeschaltetem Bildschirm weiter?
    a: Ja. Audio Blackbox läuft als Vordergrunddienst mit dauerhafter Benachrichtigung. Eine Anleitung hilft dabei, die App von der Akkuoptimierung des Herstellers auszunehmen, damit die Aufnahme auch bei gesperrtem Bildschirm ohne Unterbrechung weiterläuft.
  - q: Leert ein ständig aktiver Rekorder den Akku?
    a: Audio Blackbox wurde auf einem Samsung Galaxy S25 bei kontinuierlicher Aufnahme mit dem Profil Sprache gemessen. Bei ausgeschaltetem Bildschirm benötigte es etwa 1,0 % bis 1,5 % Akku pro Stunde und weniger als 1 % CPU, ohne Schreibzugriffe auf den Datenträger während der Pufferung. Andere Handys und Einstellungen liefern andere Werte.
  - q: Ist Audio Blackbox kostenlos und quelloffen?
    a: "Sie ist quelloffen unter der GNU General Public License v3.0, mit dem vollständigen Quellcode auf GitHub. Installation und Nutzung sind kostenlos. Die einzige kostenpflichtige Option ist ein Pro-Upgrade per Einmalkauf, das die 2-Stunden-Grenze einer Live-Aufnahme aufhebt; alles andere, einschließlich des rückwirkenden Puffers und aller Qualitätsprofile, bleibt kostenlos. Wer vor der Einführung von Pro installiert hat, bekommt Pro ohne Kosten."
  - q: "Gibt es eine quelloffene Alternative zu rückwirkenden Aufnahme-Apps auf Android?"
    a: "Ja. Audio Blackbox lässt sich kostenlos bei Google Play installieren, mit optionalem Pro-Upgrade per Einmalkauf. Die App hat kein Konto und keine Werbung und enthält keine Analyse oder Tracker. Sie steht unter der GNU General Public License v3.0 und der vollständige Quellcode liegt auf GitHub, sodass jeder prüfen kann, wie Puffer und Speichern funktionieren und dass das Audio nie das Gerät verlässt."
  - q: Welche Android-Versionen werden unterstützt?
    a: Android 10 (API-Level 29) und neuer.
  - q: Wie bekomme ich Audio Blackbox?
    a: "Audio Blackbox lässt sich kostenlos bei Google Play installieren. Öffne den Play-Store-Eintrag auf deinem Android-Gerät und tippe auf Installieren; der Link steht im Download-Bereich dieser Seite."
  - q: Wie unterscheidet sich Audio Blackbox von Google Recorder oder einem normalen Sprachrekorder?
    a: Ein normaler Rekorder nimmt erst nach dem Drücken der Aufnahmetaste auf. Alles zuvor Gesagte geht verloren. Audio Blackbox nimmt kontinuierlich in einen Ringpuffer im RAM auf und schreibt erst beim Tippen auf Speichern in den Gerätespeicher. So kannst du die letzten Minuten von etwas speichern, das bereits passiert ist. Bis zu deiner Entscheidung zum Speichern wird nichts auf den Datenträger geschrieben, und deine Aufnahmen werden nie hochgeladen.
  - q: "Gibt es eine Audio-Dashcam-App für Android?"
    a: "Ja. Audio Blackbox funktioniert wie eine Dashcam für Ton: Die App hält die letzten Minuten in einem Ringpuffer im RAM und schreibt sie erst in eine Datei, wenn du auf Speichern tippst, damit du behältst, was gerade passiert ist. Anders als ein versteckter Rekorder zeigt sie während der Aufnahme immer eine Benachrichtigung an. Die Aufnahme anderer Personen kann deren Einwilligung erfordern, prüfe daher die Gesetze vor Ort."
  - q: "Kann ich ein Zitat oder eine Erklärung aus der Vorlesung retten, die ich nicht aufgenommen habe?"
    a: "Wenn Audio Blackbox lief, ja. Tippe auf Speichern und die gepufferten Minuten (mindestens 5, bis zu dem, was dein Handy halten kann) werden in eine .m4a-Datei geschrieben, auch wenn du nie die Aufnahme gestartet hast. Journalisten können die App als Backup zu ihrem Hauptaufnahmegerät nutzen, und Studierende können eine gerade verpasste Erklärung behalten, wenn Aufnehmen in der Veranstaltung erlaubt ist."
  - q: "Kann mir Audio Blackbox helfen, mir gesprochene Anweisungen zu merken?"
    a: "Die App kann als Gedächtnisstütze dienen. Wenn du gerade Wegbeschreibungen, Anweisungen oder Details gehört und den Faden verloren hast, speichere die letzten Minuten und hör sie im integrierten Player noch einmal an. Das kann allen helfen, die gesprochene Informationen oft verlieren, zum Beispiel Menschen mit ADHS. Audio Blackbox ist kein Medizinprodukt."
  - q: Was ist beim Aufnehmen mit Audio Blackbox rechtlich zu beachten?
    a: Das hängt davon ab, wo du bist. Nutze Audio Blackbox für deine eigenen Gespräche und Ideen. Die Aufnahme anderer Personen kann deren Einwilligung erfordern. Die Regeln unterscheiden sich je nach Land und Bundesstaat. Prüfe vor der Aufnahme die örtlichen Gesetze zu Tonaufnahmen. Du bist für deine Nutzung der App verantwortlich.
