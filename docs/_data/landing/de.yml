privacy_title: Datenschutz in der Architektur verankert
privacy_desc: "Viele Aufnahme-Apps verlangen Cloud-Logins, Analyse im Hintergrund und regelmäßige Synchronisierung. Audio Blackbox hat <strong>kein Konto</strong>, <strong>keine Werbung</strong> und <strong>keine Analyse-SDKs</strong>, und deine Aufnahmen verlassen nie das Gerät. Deine Stimme bleibt im flüchtigen Speicher, bis du sie im lokalen Gerätespeicher sicherst. Der einzige Netzwerkzugriff, den die App deklariert, gehört zu Google Play Billing, für den optionalen Pro-Kauf."
usage_tag: Verwendung
usage_title: So verwendest du Audio Blackbox
usage_intro: 'Nach der Installation läuft die App als Hintergrunddienst, den du selten öffnest: Sie hört zu, und du tippst auf Speichern, wenn etwas behalten werden soll.'
usage_1: Öffne die App und erteile auf Nachfrage die Berechtigung <code>RECORD_AUDIO</code> (unter Android 13+ auch <code>POST_NOTIFICATIONS</code>).
usage_2: Folge der Anleitung zum Ausnehmen der App von der Akkuoptimierung, damit der Hersteller den Aufnahmedienst bei ausgeschaltetem Bildschirm nicht beendet.
usage_3: Starte die kontinuierliche Aufnahme. Die App läuft als Vordergrunddienst mit dauerhafter Benachrichtigung und hält die letzten Minuten im RAM (mindestens 5, bis zur Grenze deines Handys). Älteres Audio wird verworfen, sobald neues hinzukommt.
usage_4: Wenn gerade etwas passiert ist, das du behalten möchtest, tippe auf <strong>Speichern</strong>. Audio Blackbox schreibt das Audio im Puffer seit dem letzten Speichern (beim ersten Mal den ganzen Puffer) als <code>.m4a</code>-Datei (AAC) in den lokalen Gerätespeicher. Du musst nichts vorbereiten oder vorhersehen.
usage_5: Öffne den integrierten Player, um die exportierte Aufnahme anzuhören, zu spulen und über ein beliebiges Ziel im Android-Teilen-Menü zu teilen.
