faq:
  - q: Gibt es eine Android-App, die die letzten 5 Minuten Audio aufnimmt?
    a: "Ja. Der Puffer beginnt bei 5 Minuten, in 5-Minuten-Schritten, bis zur sicheren Speichergrenze der App für die gewählte Qualität. Es gibt keine produktseitige Dauerbegrenzung; die Einstellungen zeigen die aktuelle Grenze."
  - q: Wie kann ich Audio von vor dem Drücken der Aufnahmetaste speichern?
    a: Ein normaler Rekorder kann das nicht, weil er erst beim Drücken der Aufnahmetaste beginnt. Bei Audio Blackbox schaltest du die kontinuierliche Aufnahme einmal ein. Die letzten Minuten bleiben in einem Ringpuffer im RAM, wobei das neueste Audio das älteste ersetzt. Ist gerade etwas passiert, das du behalten möchtest, tippe auf Speichern, um diese Minuten in eine Datei zu schreiben. Audio bleibt bis zum Speichern oder Start von Live im RAM.
  - q: Was ist ein rückwirkender Rekorder oder ein Rekorder mit ständig aktivem Puffer?
    a: "Er nimmt fortlaufend in einen Speicherpuffer fester Größe auf. Live speichert das gepufferte Audio von vor dem Tippen und nimmt in einer einzigen .aac-Datei (ADTS) weiter auf, die schon während der Aufnahme abspielbar ist. Die Live-Aufnahmezeit ist kostenlos auf 2 Stunden begrenzt; danach wird die Datei automatisch gespeichert. Mit der gepufferten Vergangenheit kann die Datei länger als 2 Stunden sein. Pro hebt per Einmalkauf die Live-Zeitgrenze auf."
  - q: Wie lang ist der Audiopuffer und wie viel RAM benötigt er?
    a: "Der Puffer beginnt bei 5 Minuten, in 5-Minuten-Schritten, bis zur sicheren Speichergrenze der App für die gewählte Qualität. Es gibt keine produktseitige Dauerbegrenzung; die Einstellungen zeigen die aktuelle Grenze. Beim Standardprofil Sprache (16.000 Hz mono) benötigt jede Minute etwa 1,8 MB RAM, also etwa 55 MB für 30 Minuten. Ausgewogen (32.000 Hz mono) benötigt pro Minute doppelt so viel, Hohe Klangtreue (44.100 Hz stereo) etwa das 5,5-Fache. Dasselbe Handy hält bei höherer Qualität daher einen kürzeren Puffer. Der Rechner im Abschnitt Speicherarchitektur zeigt den RAM-Bedarf für jede Dauer und jedes Profil."
  - q: Lädt Audio Blackbox etwas hoch oder braucht es eine Internetverbindung?
    a: "Aufnehmen und Speichern funktionieren offline. Die App selbst sendet weder Audio noch Nutzungsanalysen. Google Play Billing (Google Play-Dienste) kommuniziert mit Google, um den optionalen Kauf abzuwickeln und die Pro-Berechtigung zu prüfen; die Bibliothek sendet auch eigene Nutzungs- und Fehlerdiagnosen. Keine Werbung, kein Konto und kein Cloud-Audiospeicher."
  - q: Läuft die Aufnahme bei ausgeschaltetem Bildschirm weiter?
    a: Ja. Audio Blackbox läuft als Vordergrunddienst mit dauerhafter Benachrichtigung. Eine Anleitung hilft dabei, die App von der Akkuoptimierung des Herstellers auszunehmen, damit die Aufnahme auch bei gesperrtem Bildschirm ohne Unterbrechung weiterläuft.
  - q: Leert ein ständig aktiver Rekorder den Akku?
    a: Audio Blackbox wurde auf einem Samsung Galaxy S25 bei kontinuierlicher Aufnahme mit dem Profil Sprache gemessen. Bei ausgeschaltetem Bildschirm benötigte es etwa 1,0 % bis 1,5 % Akku pro Stunde und weniger als 1 % CPU, ohne Schreibzugriffe auf den Datenträger während der Pufferung. Andere Handys und Einstellungen liefern andere Werte.
  - q: Ist Audio Blackbox kostenlos und quelloffen?
    a: "Installation und Nutzung sind kostenlos, der Quellcode steht unter GPL-3.0. Nur das optionale Pro-Upgrade per Einmalkauf ist kostenpflichtig. Live speichert das gepufferte Audio von vor dem Tippen und nimmt in einer einzigen .aac-Datei (ADTS) weiter auf, die schon während der Aufnahme abspielbar ist. Die Live-Aufnahmezeit ist kostenlos auf 2 Stunden begrenzt; danach wird die Datei automatisch gespeichert. Mit der gepufferten Vergangenheit kann die Datei länger als 2 Stunden sein. Pro hebt per Einmalkauf die Live-Zeitgrenze auf. Pro kostenlos für Frühentschlossene: Installiere Audio Blackbox bis zum 19. Dezember 2026 (vor dem 20. Dezember, 00:00 Uhr Brasília-Zeit, UTC−3), und Pro bleibt auf diesem Gerät dauerhaft kostenlos freigeschaltet. Der Vorteil gilt für diese Installation: Wenn du die App deinstallierst und neu installierst oder das Gerät wechselst, bleibt er nicht erhalten."
  - q: "Gibt es eine quelloffene Alternative zu rückwirkenden Aufnahme-Apps auf Android?"
    a: "Installation und Nutzung sind kostenlos, der Quellcode steht unter GPL-3.0. Nur das optionale Pro-Upgrade per Einmalkauf ist kostenpflichtig. Die App selbst sendet weder Audio noch Nutzungsanalysen. Google Play Billing (Google Play-Dienste) kommuniziert mit Google, um den optionalen Kauf abzuwickeln und die Pro-Berechtigung zu prüfen; die Bibliothek sendet auch eigene Nutzungs- und Fehlerdiagnosen. Keine Werbung, kein Konto und kein Cloud-Audiospeicher."
  - q: Welche Android-Versionen werden unterstützt?
    a: Android 10 (API-Level 29) und neuer.
  - q: Wie bekomme ich Audio Blackbox?
    a: "Audio Blackbox lässt sich kostenlos bei Google Play installieren. Öffne den Play-Store-Eintrag auf deinem Android-Gerät und tippe auf Installieren; der Link steht im Download-Bereich dieser Seite."
  - q: Wie unterscheidet sich Audio Blackbox von Google Recorder oder einem normalen Sprachrekorder?
    a: Ein normaler Rekorder nimmt erst nach dem Drücken der Aufnahmetaste auf. Alles zuvor Gesagte geht verloren. Audio Blackbox nimmt kontinuierlich in einen Ringpuffer im RAM auf und schreibt beim Tippen auf Speichern oder beim Start von Live in den Gerätespeicher. So kannst du die letzten Minuten von etwas speichern, das bereits passiert ist. Audio bleibt bis zum Speichern oder Start von Live im RAM, und deine Aufnahmen werden nie hochgeladen.
  - q: "Gibt es eine Audio-Dashcam-App für Android?"
    a: "Ja. Audio Blackbox funktioniert wie eine Dashcam für Ton: Die App hält die letzten Minuten in einem Ringpuffer im RAM und schreibt sie in eine Datei, wenn du auf Speichern tippst oder Live startest, damit du behältst, was gerade passiert ist. Anders als ein versteckter Rekorder zeigt sie während der Aufnahme immer eine Benachrichtigung an. Die Aufnahme anderer Personen kann deren Einwilligung erfordern, prüfe daher die Gesetze vor Ort."
  - q: "Kann ich ein Zitat oder eine Erklärung aus der Vorlesung retten, die ich nicht aufgenommen habe?"
    a: "Wenn Audio Blackbox lief, ja. Tippe auf Speichern und die gepufferten Minuten (mindestens 5, bis zur sicheren Speichergrenze der App für die gewählte Qualität) werden in eine .m4a-Datei geschrieben, auch wenn du nie die Aufnahme gestartet hast. Journalisten können die App als Backup zu ihrem Hauptaufnahmegerät nutzen, und Studierende können eine gerade verpasste Erklärung behalten, wenn Aufnehmen in der Veranstaltung erlaubt ist."
  - q: "Kann mir Audio Blackbox helfen, mir gesprochene Anweisungen zu merken?"
    a: "Die App kann als Gedächtnisstütze dienen. Wenn du gerade Wegbeschreibungen, Anweisungen oder Details gehört und den Faden verloren hast, speichere die letzten Minuten und hör sie im integrierten Player noch einmal an. Das kann allen helfen, die gesprochene Informationen oft verlieren, zum Beispiel Menschen mit ADHS. Audio Blackbox ist kein Medizinprodukt."
  - q: Was ist beim Aufnehmen mit Audio Blackbox rechtlich zu beachten?
    a: Das hängt davon ab, wo du bist. Nutze Audio Blackbox für deine eigenen Gespräche und Ideen. Die Aufnahme anderer Personen kann deren Einwilligung erfordern. Die Regeln unterscheiden sich je nach Land und Bundesstaat. Prüfe vor der Aufnahme die örtlichen Gesetze zu Tonaufnahmen. Du bist für deine Nutzung der App verantwortlich.
