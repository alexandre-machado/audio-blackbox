title: 'Audio Blackbox: Vergangenes auf Android aufnehmen'
description: Audio Blackbox ist ein kostenloser, quelloffener Android-Rekorder, der die letzten Minuten Ton im RAM hält, um das gerade gehörte Riff, die Idee oder das Meeting zu speichern. Erst beim Tippen auf Speichern wird geschrieben. Die App hat keine Internetberechtigung.
social_description: Speichere die gerade gehörten letzten Minuten. Ein RAM-Ringpuffer passend zu deinem Handy, ohne Internetberechtigung, kostenlos und quelloffen.
image_alt: 'Audio-Blackbox-Grafik: ein kontinuierlicher Puffer für Umgebungsgeräusche auf Android im Stil eines Cockpit-Instrumentenbretts.'
