overview_tag: Panoramica
overview_title: Cos'è Audio Blackbox?
overview_intro: Audio Blackbox è un'app Android gratuita e open source che conserva continuamente gli ultimi minuti di suono in RAM e li scrive nella memoria di archiviazione locale solo quando tocchi Salva. Il buffer circolare dura almeno 5 minuti, regolabili a intervalli di 5, e il suo massimo viene calcolato sul telefono in base alla memoria utilizzabile in sicurezza e al profilo di qualità scelto.
overview_detail: >-
  Risolve un problema che un normale registratore vocale non può risolvere: ti accorgi che qualcosa era importante solo <em>dopo</em> che è stato detto, quando premere registra non serve più. Audio Blackbox continua a registrare nella propria memoria mentre è visibile la notifica. Toccando Salva esporti l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) in un file locale <code>.m4a</code> (AAC), senza riavvolgere e senza sovrapposizioni tra i file. È pensata per musicisti e autori, idee e pensieri ad alta voce, riunioni e accordi a cui partecipi e momenti in famiglia.
overview_privacy: >-
  A differenza di un normale registratore o di un'app di trascrizione nel cloud, Audio Blackbox non ha il permesso <code>INTERNET</code> nel manifest, SDK di analisi né account: non scrive nulla su disco finché non decidi di salvare e non carica mai nulla.
features_tag: Funzionalità
features_title: Progettata per la privacy totale e il recupero immediato
features_intro: Cattura continua dell'ambiente senza usurare l'SSD, scaricare la batteria o caricare un solo byte nel cloud.
feature_lookback: Salva il passato (Lookback)
feature_lookback_desc: Hai appena suonato un riff da conservare o espresso un'idea ad alta voce? Tocca Salva e Audio Blackbox scrive l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) in un file locale. Live conserva il passato nel buffer e continua a registrare finché non la fermi.
feature_network: Nessun permesso di rete
feature_network_desc: Il permesso <code>INTERNET</code> è del tutto assente dal manifest dell'app. Non può inviare telemetria, contattare servizi di analisi o caricare suoni. Funzionamento completamente offline garantito.
feature_capture: Ciclo di cattura dedicato
feature_capture_desc: Nessun I/O su disco e nessuna allocazione IPC sul thread di cattura audio. La sincronizzazione garantita con un solo scrittore elimina interruzioni e pause della garbage collection.
feature_interrupt: Rileva le catture simultanee
feature_interrupt_desc: Quando un'altra app in primo piano occupa il microfono, Android silenzia il nostro flusso invece di farlo fallire. Il servizio lo rileva direttamente e va in pausa, poi riprende appena il microfono è libero. L'intervallo viene conservato come silenzio reale, così i riferimenti temporali esportati non si spostano.
feature_battery: Protezione dall'ottimizzazione della batteria
feature_battery_desc: Un servizio in primo piano con notifica attiva e una guida per escludere l'app dall'ottimizzazione della batteria del produttore mantengono la registrazione senza interruzioni anche a schermo spento.
feature_player: Lettore audio integrato
feature_player_desc: Ascolta, scorri, elimina e condividi le registrazioni <code>.m4a</code> (AAC) tramite il pannello di condivisione Android. Un widget sulla schermata iniziale avvia o ferma la registrazione con un tocco.
design_tag: Sistema di design dell'aviazione statunitense
design_title: Prototipo vivo del design avionico
design_desc: 'Prova il simulatore interattivo di cockpit nel browser: misuratore VU in tempo reale, spie di stato Korry, etichetta di sicurezza "REMOVE BEFORE FLIGHT" e buffer di memoria a nastro di volo.'
design_launch: Apri il modello di design →
memory_tag: Architettura della memoria
memory_title: Uso prevedibile della RAM
memory_desc: Audio Blackbox alloca il buffer circolare in anticipo, quindi il costo in RAM è noto prima della registrazione. Ridimensiona un buffer attivo solo quando la memoria è disponibile. Sposta il cursore per vedere la RAM necessaria a ogni intervallo e profilo.
