hero_title: Audio Blackbox per Android
hero_lead: Conserva il riff appena suonato, l'idea appena espressa ad alta voce o quanto concordato in una riunione a cui partecipavi. L'app mantiene gli ultimi minuti di suono in RAM, in base alla capacità del telefono, e scrive nella memoria di archiviazione <strong>solo quando tocchi Salva</strong>.
