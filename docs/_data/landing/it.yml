privacy_title: Privacy nell'architettura
privacy_desc: Molte app di registrazione richiedono accessi al cloud, analisi in background e sincronizzazioni periodiche. Audio Blackbox <strong>non ha il permesso internet</strong> nel manifest Android, <strong>non ha SDK di analisi</strong> e non contatta mai server remoti. La tua voce rimane nella memoria volatile finché non la salvi nell'archiviazione locale.
usage_tag: Uso
usage_title: Come usare Audio Blackbox
usage_intro: 'Una volta installata, l’app è un servizio in background che apri raramente: ascolta e tu tocchi Salva quando qualcosa merita di essere conservato.'
usage_1: Apri l'app e concedi il permesso <code>RECORD_AUDIO</code> (e, su Android 13+, <code>POST_NOTIFICATIONS</code>) quando richiesto.
usage_2: Segui la guida per escludere l'app dall'ottimizzazione della batteria, così il produttore non termina il servizio di registrazione a schermo spento.
usage_3: Avvia la registrazione continua. L'app funziona come servizio in primo piano con una notifica persistente e mantiene gli ultimi minuti in RAM (almeno 5, fino al limite del telefono), scartando l'audio vecchio man mano che arriva quello nuovo.
usage_4: Quando è appena accaduto qualcosa da conservare, tocca <strong>Salva</strong>. Audio Blackbox scrive l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) nell'archiviazione locale come file <code>.m4a</code> (AAC), senza dover preparare o prevedere nulla.
usage_5: Apri il lettore integrato per ascoltare, scorrere e condividere la registrazione esportata tramite qualsiasi destinazione del pannello di condivisione Android.
