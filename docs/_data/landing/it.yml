title: 'Audio Blackbox: registra il passato su Android'
description: Audio Blackbox è un registratore Android gratuito e open source che conserva gli ultimi minuti di suono in RAM per salvare il riff, l'idea o la riunione appena ascoltati. Non scrive nulla finché non tocchi Salva e non ha il permesso internet.
social_description: Salva gli ultimi minuti appena ascoltati. Un buffer circolare in RAM adatto al telefono, senza permesso internet, gratuito e open source.
