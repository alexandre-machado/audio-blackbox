preset_note: '* Questi sono i tre profili dell’app. Voce è quello predefinito: 16 kHz mono è sufficiente per il parlato, quasi sempre catturato da un registratore ambientale, e offre un intervallo molto più lungo. Alta fedeltà è stereo, il che attiva anche più di un microfono sui dispositivi che ne hanno diversi.'
slider_note: '* Il cursore è illustrativo. L’app non ha un intervallo massimo fisso: il limite reale viene calcolato sul telefono in base alla memoria utilizzabile in sicurezza e al profilo scelto, e mostrato nelle Impostazioni. Il cursore si ferma a 120 minuti per praticità d’uso, non perché lo faccia l’app.'
