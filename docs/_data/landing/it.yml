usage_tag: Uso
usage_title: Come usare Audio Blackbox
usage_intro: 'Una volta installata, l’app è un servizio in background che apri raramente: ascolta e tu tocchi Salva quando qualcosa merita di essere conservato.'
usage_1: Apri l'app e concedi il permesso <code>RECORD_AUDIO</code> (e, su Android 13+, <code>POST_NOTIFICATIONS</code>) quando richiesto.
usage_2: Segui la guida per escludere l'app dall'ottimizzazione della batteria, così il produttore non termina il servizio di registrazione a schermo spento.
usage_3: "Avvia la registrazione continua. L'app funziona come servizio in primo piano con una notifica persistente e mantiene gli ultimi minuti in RAM (almeno 5, fino al limite sicuro di memoria dell'app per la qualità scelta), scartando l'audio vecchio man mano che arriva quello nuovo."
usage_4: Quando è appena accaduto qualcosa da conservare, tocca <strong>Salva</strong>. Audio Blackbox scrive l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) nell'archiviazione locale come file <code>.m4a</code> (AAC) o <code>.ogg</code> (Opus), senza dover preparare o prevedere nulla.
usage_5: Apri il lettore integrato per ascoltare, scorrere e condividere la registrazione esportata tramite qualsiasi destinazione del pannello di condivisione Android.
download_tag: Scarica
download_title: Scarica Audio Blackbox da Google Play
download_intro: "Uso gratuito, con sblocco Pro facoltativo ad acquisto unico. Open source e disponibile ora per Android 10 e versioni successive. Pro gratis per chi arriva prima: installa Audio Blackbox entro il 19 dicembre 2026 (prima del 20 dicembre alle 00:00, ora di Brasília, UTC−3) e Pro resta sbloccato su quel dispositivo, senza costi, per sempre. Il beneficio vale per quella installazione: se disinstalli e reinstalli l'app, o cambi dispositivo, non viene mantenuto."
