hero_title: Audio Blackbox per Android
hero_lead: "Una dashcam audio in tasca. Conserva il riff appena suonato, la citazione che stavi per perdere o le istruzioni che ti hanno appena dato. Tiene gli ultimi minuti di suono in RAM, entro il limite sicuro di memoria dell’app, e scrive nella memoria <strong>quando tocchi Salva o avvii Live</strong>."
