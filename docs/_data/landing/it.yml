demo_alert: 'Dimostrazione: nell’app, Salva scrive l’audio nel buffer dall’ultimo salvataggio (l’intero buffer la prima volta) in un file .m4a (AAC) in Recordings/Blackbox/.'
faq:
  - q: Esiste un'app Android che registra gli ultimi 5 minuti di audio?
    a: Sì. Audio Blackbox conserva gli ultimi minuti di suono nella RAM del telefono mentre è visibile la notifica. Il buffer dura almeno 5 minuti, regolabili a intervalli di 5, e può essere più lungo. L'app calcola il massimo sul telefono in base alla memoria utilizzabile in sicurezza e al profilo di qualità scelto. Tocca Salva e l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) diventa un file locale .m4a (AAC).
  - q: Come posso salvare l'audio precedente alla pressione di registra?
    a: Un registratore normale non può farlo perché inizia a catturare solo quando premi registra. Con Audio Blackbox attivi una volta la registrazione continua, che mantiene gli ultimi minuti in un buffer circolare in RAM, sostituendo l'audio vecchio con quello nuovo. Quando è appena accaduto qualcosa da conservare, tocca Salva per scrivere quei minuti in un file. Non viene scritto nulla nell'archiviazione finché non tocchi Salva.
  - q: Cos'è un registratore retroattivo o con buffer sempre attivo?
    a: È un registratore che cattura continuamente in un buffer di memoria di dimensioni fisse, per salvare ciò che è già stato detto invece di solo quello che viene dopo aver premuto registra. Audio Blackbox funziona così su Android, come servizio in primo piano con notifica persistente. Mantiene gli ultimi minuti in RAM e scarta l'audio vecchio man mano che arriva quello nuovo. Salva esporta l'audio nel buffer; Live conserva il passato nel buffer e continua a registrare finché non la fermi.
  - q: Quanto dura il buffer audio e quanta RAM usa?
    a: Almeno 5 minuti, regolabili a intervalli di 5. Non c'è un massimo fisso. L'app calcola il limite sul telefono in base alla memoria utilizzabile in sicurezza e al profilo scelto e lo mostra nelle Impostazioni. Con il profilo predefinito Voce (16.000 Hz mono), ogni minuto usa circa 1,8 MB di RAM, quindi 30 minuti sono circa 55 MB. Bilanciato (32.000 Hz mono) usa il doppio al minuto e Alta fedeltà (44.100 Hz stereo) circa 5,5 volte tanto. Lo stesso telefono mantiene quindi un buffer più corto a qualità superiore. Il calcolatore nella sezione Architettura della memoria mostra la RAM per qualsiasi intervallo e profilo.
  - q: Audio Blackbox carica qualcosa o richiede una connessione internet?
    a: No. Il permesso INTERNET è del tutto assente dal manifest Android dell'app, che quindi non può inviare telemetria, contattare servizi di analisi o caricare suoni. L'app non carica mai nulla. L'audio resta nella RAM volatile finché non lo salvi, poi viene scritto nella cartella Recordings/Blackbox del telefono (Music/Blackbox su Android 10 e 11), sotto il tuo controllo.
  - q: Continua a registrare a schermo spento?
    a: Sì. Audio Blackbox funziona come servizio in primo piano con notifica persistente e include una guida per escludere l'app dall'ottimizzazione della batteria del produttore, così la cattura continua senza interruzioni a schermo bloccato.
  - q: Un registratore sempre attivo scarica la batteria?
    a: Audio Blackbox è stato misurato su un Samsung Galaxy S25 mentre registrava continuamente con il profilo Voce. A schermo spento usava circa l'1,0%–1,5% di batteria all'ora e meno dell'1% di CPU, senza scritture su disco durante il riempimento del buffer. Altri telefoni e impostazioni daranno risultati diversi.
  - q: Audio Blackbox è gratuita e open source?
    a: Sì. È gratuita e distribuita con licenza GNU General Public License v3.0, con tutto il codice sorgente pubblicato su GitHub.
  - q: Esiste un'alternativa gratuita e open source alle app di registrazione retroattiva su Android?
    a: Sì. Audio Blackbox è gratuita su Google Play. L'app non ha account né pubblicità e non contiene analisi o strumenti di tracciamento. Ha licenza GNU General Public License v3.0 e tutto il codice è su GitHub. Chiunque può verificare come funzionano il buffer e il salvataggio e confermare che il manifest non ha il permesso INTERNET.
  - q: Quali versioni di Android sono supportate?
    a: Android 10 (livello API 29) e versioni successive.
  - q: Come posso ottenere Audio Blackbox?
    a: Audio Blackbox è gratuita su Google Play. Apri la sua scheda Play Store sul tuo Android e tocca Installa. Il collegamento è nella sezione Scarica di questa pagina.
  - q: In cosa Audio Blackbox è diversa da Google Recorder o da un normale registratore vocale?
    a: Un registratore normale cattura solo dopo aver premuto registra, quindi tutto ciò che è stato detto prima va perso. Audio Blackbox registra continuamente in un buffer circolare in RAM e scrive nell'archiviazione solo quando tocchi Salva. Puoi così conservare gli ultimi minuti di qualcosa che è già accaduto. Non viene scritto nulla su disco finché non decidi di salvare e l'app non carica mai nulla.
  - q: Cosa prevede la legge sulle registrazioni con Audio Blackbox?
    a: Dipende da dove ti trovi. Usa Audio Blackbox per le tue conversazioni e idee. Registrare altre persone può richiedere il loro consenso e le regole variano tra paesi e stati. Consulta le leggi locali sulle registrazioni prima di registrare. Sei responsabile dell'uso che fai dell'app.
