preset_note: '* Questi sono i tre profili dell’app. Voce è quello predefinito: 16 kHz mono è sufficiente per il parlato, quasi sempre catturato da un registratore ambientale, e offre un intervallo molto più lungo. Alta fedeltà è stereo, il che attiva anche più di un microfono sui dispositivi che ne hanno diversi.'
slider_note: "* Il cursore è illustrativo. Il buffer parte da 5 minuti, regolabili a intervalli di 5, fino al limite sicuro di memoria dell'app per la qualità scelta. Il prodotto non impone un tetto alla durata; le Impostazioni mostrano il limite attuale. Il cursore si ferma a 120 minuti per praticità d’uso, non perché lo faccia l’app."
