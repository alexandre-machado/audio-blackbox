faq:
  - q: Esiste un'app Android che registra gli ultimi 5 minuti di audio?
    a: "Sì. Il buffer parte da 5 minuti, regolabili a intervalli di 5, fino al limite sicuro di memoria dell'app per la qualità scelta. Il prodotto non impone un tetto alla durata; le Impostazioni mostrano il limite attuale."
  - q: Come posso salvare l'audio precedente alla pressione di registra?
    a: Un registratore normale non può farlo perché inizia a catturare solo quando premi registra. Con Audio Blackbox attivi una volta la registrazione continua, che mantiene gli ultimi minuti in un buffer circolare in RAM, sostituendo l'audio vecchio con quello nuovo. Quando è appena accaduto qualcosa da conservare, tocca Salva per scrivere quei minuti in un file. L’audio resta in RAM finché non tocchi Salva o avvii Live.
  - q: Cos'è un registratore retroattivo o con buffer sempre attivo?
    a: "È un registratore che cattura continuamente in un buffer di memoria di dimensioni fisse, per salvare ciò che è già stato detto invece di solo quello che viene dopo aver premuto registra. Live salva l’audio nel buffer precedente al tocco e continua in un unico file: .aac (ADTS) con AAC (predefinito), riproducibile durante la registrazione, oppure .ogg con Opus, da ascoltare al termine della registrazione. Il tempo di registrazione live è limitato a 2 ore nel piano gratuito; poi il file viene salvato automaticamente. Il file può superare le 2 ore perché include il passato nel buffer. Pro, con acquisto unico, rimuove il limite di tempo live."
  - q: Quanto dura il buffer audio e quanta RAM usa?
    a: "Il buffer parte da 5 minuti, regolabili a intervalli di 5, fino al limite sicuro di memoria dell'app per la qualità scelta. Il prodotto non impone un tetto alla durata; le Impostazioni mostrano il limite attuale. Con il profilo predefinito Voce (16.000 Hz mono), ogni minuto usa circa 1,8 MB di RAM, quindi 30 minuti sono circa 55 MB. Bilanciato (32.000 Hz mono) usa il doppio al minuto e Alta fedeltà (44.100 Hz stereo) circa 5,5 volte tanto. Lo stesso telefono mantiene quindi un buffer più corto a qualità superiore. Il calcolatore nella sezione Architettura della memoria mostra la RAM per qualsiasi intervallo e profilo."
  - q: Audio Blackbox carica qualcosa o richiede una connessione internet?
    a: "Registrazione e salvataggio funzionano offline. L'app stessa non invia audio né analisi di utilizzo. Google Play Billing (servizi Google Play) comunica con Google per elaborare l'acquisto facoltativo e verificare il diritto a Pro; la libreria invia anche la propria diagnostica di utilizzo ed errori. Nessuna pubblicità, account o archiviazione audio nel cloud."
  - q: Continua a registrare a schermo spento?
    a: Sì. Audio Blackbox funziona come servizio in primo piano con notifica persistente e include una guida per escludere l'app dall'ottimizzazione della batteria del produttore, così la cattura continua senza interruzioni a schermo bloccato.
  - q: Un registratore sempre attivo scarica la batteria?
    a: Audio Blackbox è stato misurato su un Samsung Galaxy S25 mentre registrava continuamente con il profilo Voce. A schermo spento usava circa l'1,0%–1,5% di batteria all'ora e meno dell'1% di CPU, senza scritture su disco durante il riempimento del buffer. Altri telefoni e impostazioni daranno risultati diversi.
  - q: Audio Blackbox è gratuita e open source?
    a: "Installazione e uso gratuiti, codice open source sotto GPL-3.0. Tutto resta gratuito salvo lo sblocco Pro facoltativo con acquisto unico. Live salva l’audio nel buffer precedente al tocco e continua in un unico file: .aac (ADTS) con AAC (predefinito), riproducibile durante la registrazione, oppure .ogg con Opus, da ascoltare al termine della registrazione. Il tempo di registrazione live è limitato a 2 ore nel piano gratuito; poi il file viene salvato automaticamente. Il file può superare le 2 ore perché include il passato nel buffer. Pro, con acquisto unico, rimuove il limite di tempo live. Pro gratis per chi arriva prima: installa Audio Blackbox entro il 19 dicembre 2026 (prima del 20 dicembre alle 00:00, ora di Brasília, UTC−3) e Pro resta sbloccato su quel dispositivo, senza costi, per sempre. Il beneficio vale per quella installazione: se disinstalli e reinstalli l'app, o cambi dispositivo, non viene mantenuto."
  - q: "Esiste un'alternativa open source alle app di registrazione retroattiva su Android?"
    a: "Installazione e uso gratuiti, codice open source sotto GPL-3.0. Tutto resta gratuito salvo lo sblocco Pro facoltativo con acquisto unico. L'app stessa non invia audio né analisi di utilizzo. Google Play Billing (servizi Google Play) comunica con Google per elaborare l'acquisto facoltativo e verificare il diritto a Pro; la libreria invia anche la propria diagnostica di utilizzo ed errori. Nessuna pubblicità, account o archiviazione audio nel cloud."
  - q: Quali versioni di Android sono supportate?
    a: Android 10 (livello API 29) e versioni successive.
  - q: Come posso ottenere Audio Blackbox?
    a: "Audio Blackbox è gratuita da installare su Google Play. Apri la sua scheda Play Store sul tuo Android e tocca Installa; il link si trova nella sezione Download di questa pagina."
  - q: In cosa Audio Blackbox è diversa da Google Recorder o da un normale registratore vocale?
    a: Un registratore normale cattura solo dopo aver premuto registra, quindi tutto ciò che è stato detto prima va perso. Audio Blackbox registra continuamente in un buffer circolare in RAM e scrive nell'archiviazione quando tocchi Salva o avvii Live. Puoi così conservare gli ultimi minuti di qualcosa che è già accaduto. L’audio resta in RAM finché non salvi o avvii Live e le tue registrazioni non vengono mai caricate.
  - q: "Esiste un'app dashcam audio per Android?"
    a: "Sì. Audio Blackbox funziona come una dashcam per il suono: tiene gli ultimi minuti in un buffer circolare in RAM e li scrive su file quando tocchi Salva o avvii Live, così conservi quello che è appena successo. A differenza di un registratore nascosto, mostra sempre una notifica mentre registra. Registrare altre persone può richiedere il loro consenso, quindi verifica le leggi locali."
  - q: "Posso recuperare una citazione o una spiegazione a lezione che ho dimenticato di registrare?"
    a: "Se Audio Blackbox era attivo, sì. Tocca Salva e i minuti nel buffer (almeno 5, fino al limite sicuro di memoria dell'app per la qualità scelta) vengono scritti in un file .m4a (AAC) o .ogg (Opus), anche se non hai mai premuto registra. I giornalisti possono usarlo come backup del registratore principale, e gli studenti possono conservare una spiegazione appena persa nelle lezioni in cui registrare è consentito."
  - q: "Audio Blackbox può aiutarmi a ricordare istruzioni dette a voce?"
    a: "Può fare da supporto alla memoria. Se hai appena sentito indicazioni, istruzioni o dettagli e hai perso il filo, salva gli ultimi minuti e riascoltali nel player integrato. Può aiutare chi perde spesso le informazioni a voce, ad esempio le persone con ADHD. Audio Blackbox non è un dispositivo medico."
  - q: Cosa prevede la legge sulle registrazioni con Audio Blackbox?
    a: Dipende da dove ti trovi. Usa Audio Blackbox per le tue conversazioni e idee. Registrare altre persone può richiedere il loro consenso e le regole variano tra paesi e stati. Consulta le leggi locali sulle registrazioni prima di registrare. Sei responsabile dell'uso che fai dell'app.

