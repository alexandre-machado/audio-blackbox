overview_tag: Panoramica
overview_title: Cos'è Audio Blackbox?
overview_intro: "Audio Blackbox è un'app Android open source che conserva continuamente gli ultimi minuti di suono in RAM e li scrive nella memoria di archiviazione locale quando tocchi Salva o avvii Live. Il buffer parte da 5 minuti, regolabili a intervalli di 5, fino al limite sicuro di memoria dell'app per la qualità scelta. Il prodotto non impone un tetto alla durata; le Impostazioni mostrano il limite attuale."
overview_detail: >-
  Risolve un problema che un normale registratore vocale non può risolvere: ti accorgi che qualcosa era importante solo <em>dopo</em> che è stato detto, quando premere registra non serve più. Audio Blackbox continua a registrare nella propria memoria mentre è visibile la notifica. Toccando Salva esporti l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) in un file locale <code>.m4a</code> (AAC) o <code>.ogg</code> (Opus), senza riavvolgere e senza sovrapposizioni tra i file. È pensata per musicisti e autori, idee e pensieri ad alta voce, riunioni e accordi a cui partecipi e momenti in famiglia.
overview_privacy: "L'app stessa non invia audio né analisi di utilizzo. Google Play Billing (servizi Google Play) comunica con Google per elaborare l'acquisto facoltativo e verificare il diritto a Pro; la libreria invia anche la propria diagnostica di utilizzo ed errori. Nessuna pubblicità, account o archiviazione audio nel cloud."
features_tag: Funzionalità
features_title: Progettata per la privacy totale e il recupero immediato
features_intro: Cattura continua dell'ambiente senza usurare l'SSD, scaricare la batteria o caricare il tuo audio nel cloud.
feature_lookback: Salva il passato (Lookback)
feature_lookback_desc: "Hai appena suonato un riff da conservare o espresso un'idea ad alta voce? Tocca Salva e Audio Blackbox scrive l'audio nel buffer dall'ultimo salvataggio (l'intero buffer la prima volta) in un file locale. Live salva l’audio nel buffer precedente al tocco e continua in un unico file: .aac (ADTS) con AAC (predefinito), riproducibile durante la registrazione, oppure .ogg con Opus, da ascoltare al termine della registrazione. Il tempo di registrazione live è limitato a 2 ore nel piano gratuito; poi il file viene salvato automaticamente. Il file può superare le 2 ore perché include il passato nel buffer. Pro, con acquisto unico, rimuove il limite di tempo live. Il formato audio di salvataggio è gratuito, senza Pro: AAC (predefinito) crea file .m4a con Salva, oppure scegli Opus (.ogg) per Salva e Live. AAC offre maggiore compatibilità. Opus crea file vocali più piccoli. Alcuni lettori e app di messaggistica potrebbero non aprire i file .ogg. Con Opus, attendi la fine della registrazione prima di ascoltarla. Se l’app si chiude inaspettatamente, l’audio Opus già scritto viene recuperato alla riapertura. L’ultima pagina Ogg incompleta viene scartata, quindi la parte finale può andare persa. Opus potrebbe non essere disponibile su alcuni dispositivi; in quel caso l’opzione è disabilitata con il motivo indicato."
feature_network: "L'audio non lascia mai il telefono"
feature_network_desc: "L'app stessa non invia audio né analisi di utilizzo. Google Play Billing (servizi Google Play) comunica con Google per elaborare l'acquisto facoltativo e verificare il diritto a Pro; la libreria invia anche la propria diagnostica di utilizzo ed errori. Nessuna pubblicità, account o archiviazione audio nel cloud."
feature_capture: Ciclo di cattura dedicato
feature_capture_desc: Nessun I/O su disco e nessuna allocazione IPC sul thread di cattura audio. La sincronizzazione garantita con un solo scrittore elimina interruzioni e pause della garbage collection.
feature_interrupt: Rileva le catture simultanee
feature_interrupt_desc: Quando un'altra app in primo piano occupa il microfono, Android silenzia il nostro flusso invece di farlo fallire. Il servizio lo rileva direttamente e va in pausa, poi riprende appena il microfono è libero. L'intervallo viene conservato come silenzio reale, così i riferimenti temporali esportati non si spostano.
feature_battery: Protezione dall'ottimizzazione della batteria
feature_battery_desc: Un servizio in primo piano con notifica attiva e una guida per escludere l'app dall'ottimizzazione della batteria del produttore mantengono la registrazione senza interruzioni anche a schermo spento.
feature_player: Lettore audio integrato
feature_player_desc: Ascolta, scorri, elimina e condividi le registrazioni <code>.m4a</code> / <code>.aac</code> (AAC) o <code>.ogg</code> (Opus) tramite il pannello di condivisione Android. Un widget sulla schermata iniziale avvia o ferma la registrazione con un tocco.
design_tag: Sistema di design dell'aviazione statunitense
design_title: Prototipo vivo del design avionico
design_desc: 'Prova il simulatore interattivo di cockpit nel browser: misuratore VU in tempo reale, spie di stato Korry, etichetta di sicurezza "REMOVE BEFORE FLIGHT" e buffer di memoria a nastro di volo.'
design_launch: Apri il modello di design →
memory_tag: Architettura della memoria
memory_title: Uso prevedibile della RAM
memory_desc: Audio Blackbox alloca il buffer circolare in anticipo, quindi il costo in RAM è noto prima della registrazione. Ridimensiona un buffer attivo solo quando la memoria è disponibile. Sposta il cursore per vedere la RAM necessaria a ogni intervallo e profilo.
