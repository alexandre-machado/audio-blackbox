<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' | escape }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | default: "Audio Blackbox" | escape }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url | escape }}">
</head>
<body>
  <div class="container markdown-body">
    {% if page.url != '/' and page.url != '/README.html' and page.url != '/index.html' %}
    <nav class="breadcrumb">
      <a href="{{ '/' | relative_url }}">Home</a>
    </nav>
    {% endif %}
    <main>
      {{ content }}
    </main>
  </div>
</body>
</html>
